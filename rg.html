// 死亡演出：自機がその場でバタッと倒れる（X軸回転）
function updateDeathAnim(){
  if(!deathAnim)return;
  const t=Math.min((performance.now()-deathAnim.startTime)/deathAnim.duration,1);
  // イージング（最後にバウンドせず倒れ込む）
  const e=1-Math.pow(1-t,3);
  playerGroup.rotation.x=e*(Math.PI/2)*0.95; // ほぼ真横に倒れる
  playerGroup.position.y=Math.sin(e*Math.PI)*0.1; // わずかに浮いて着地
  if(t>=1){ deathAnim=null; }
}

// ダッシュモード中：自機を激しく上下にバウンドさせる（死亡演出中は干渉しない）
function updateDashBob(){
  if(deathAnim)return;
  if(dashMode){
    playerGroup.position.y=Math.abs(Math.sin(performance.now()/65))*0.4;
  } else {
    // モンスターの徘徊時と同様に、軽く弾むような動きをつけて躍動感を出す
    playerGroup.position.y=Math.abs(Math.sin(performance.now()/300))*0.12;
  }
}

// 歩行モーション：マス移動中のみ脚・腕を振り子のように動かす（突進・死亡演出中は干渉しない）
let walkSwingAmp=0, walkPhase=0;
function updateWalkCycle(dt){
  if(deathAnim)return;
  const tx=state.x*CELL, tz=state.y*CELL;
  const dist=Math.hypot(tx-playerGroup.position.x, tz-playerGroup.position.z);
  const lungeAnim=anims.some(a=>a.mesh===playerGroup);
  const isWalking=dist>0.03&&!lungeAnim;
  walkSwingAmp+=((isWalking?1:0)-walkSwingAmp)*Math.min(dt*10,1);
  if(isWalking) walkPhase+=dt*(dashMode?14:8);
  const swing=Math.sin(walkPhase)*0.6*walkSwingAmp;
  leftLegPivot.rotation.x=swing;
  rightLegPivot.rotation.x=-swing;
  leftArmPivot.rotation.x=-swing*0.8;
  rightArmPivot.rotation.x=swing*0.8;
}

// プレイ時間(ms)を「H時間M分」または「M分S秒」形式に整形
function formatPlayTime(ms){
  const totalSec=Math.floor((ms||0)/1000);
  const h=Math.floor(totalSec/3600);
  const m=Math.floor((totalSec%3600)/60);
  const s=totalSec%60;
  if(h>0) return `${h}時間${m}分`;
  if(m>0) return `${m}分${s}秒`;
  return `${s}秒`;
}
// 保存日時を YYYY/MM/DD HH:MM に整形
function formatSavedAt(ts){
  if(!ts)return '';
  const d=new Date(ts);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function showSlotActionView(slot, data){
  cancelDeleteHold();

  saveSlotList.classList.add('hide-for-action');
  saveSlotCancelBtn.style.display='none';
  saveSlotActionView.classList.add('show');

  saveSlotStartBtn.onclick=()=>{
    closeSaveSlotModal();
    continueFromSlot(slot, data);
  };

  const DELETE_HOLD_MS=1500;
  let deleteRafId=null, deleteStartTime=0;
  const stepDeleteHold=(now)=>{
    const elapsed=now-deleteStartTime;
    const pct=Math.min(elapsed/DELETE_HOLD_MS,1);
    saveSlotDeleteFill.style.width=(pct*100)+'%';
    if(pct>=1){
      deleteRafId=null;
      deleteSaveSlot(slot);
      cancelDeleteHold();
      hideSlotActionView();
      refreshTitleSlotButtons();
      openSaveSlotModal(currentSaveSlotMode);
      return;
    }
    deleteRafId=requestAnimationFrame(stepDeleteHold);
  };
  const beginDeleteHold=(e)=>{
    e.preventDefault();
    if(deleteRafId)return;
    saveSlotDeleteBtn.classList.add('arming');
    saveSlotDeleteWarning.classList.add('show');
    saveSlotDeleteFill.style.width='0%';
    deleteStartTime=performance.now();
    deleteRafId=requestAnimationFrame(stepDeleteHold);
  };
  deleteHoldCancelFn=()=>{
    if(deleteRafId){ cancelAnimationFrame(deleteRafId); deleteRafId=null; }
    saveSlotDeleteBtn.classList.remove('arming');
    saveSlotDeleteWarning.classList.remove('show');
    saveSlotDeleteFill.style.width='0%';
  };
  saveSlotDeleteBtn.ontouchstart=beginDeleteHold;
  saveSlotDeleteBtn.onmousedown=beginDeleteHold;
  const endHold=(e)=>{ e.preventDefault(); cancelDeleteHold(); };
  saveSlotDeleteBtn.ontouchend=endHold;
  saveSlotDeleteBtn.ontouchcancel=endHold;
  saveSlotDeleteBtn.onmouseup=endHold;
  saveSlotDeleteBtn.onmouseleave=endHold;
}
function cancelDeleteHold(){ if(deleteHoldCancelFn) deleteHoldCancelFn(); }
function hideSlotActionView(){
  cancelDeleteHold();
  saveSlotActionView.classList.remove('show');
  saveSlotList.classList.remove('hide-for-action');
  saveSlotCancelBtn.style.display='';
}

function aiPhrase(poolKey,...args){

  if(pool.length===1)return pool[0];

  aiPhraseLastIdx[poolKey]=idx;
  return pool[idx];
}

let commentaryEnabled=true;
const spectatorCaptionEl=document.getElementById('spectator-caption');
let captionHideTimer=null;
function showCaption(text){
  if(!spectatorCaptionEl)return;
  spectatorCaptionEl.textContent=text;
  spectatorCaptionEl.classList.add('show');
  clearTimeout(captionHideTimer);
  // 音声合成が使えない環境では一定時間で自動的にテロップを消す
  if(!('speechSynthesis' in window)){
    captionHideTimer=setTimeout(hideCaption,2200);
  }
}
function hideCaption(){
  if(!spectatorCaptionEl)return;
  spectatorCaptionEl.classList.remove('show');
}
function aiSpeak(text){
  if(!spectatorMode)return;
  showCaption(text);
  if(!commentaryEnabled||!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel(); // 発話の詰まりを防ぎ、テロップと音声を常に最新の状況に同期させる
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=1.05; u.volume=1.0;
    u.onend=hideCaption;
    u.onerror=hideCaption;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
// AI観戦モードの音声実況ON/OFFボタン（テロップは音声OFF中も表示され続ける）
const spectatorVoiceToggleEl=document.getElementById('spectator-voice-toggle');
function updateVoiceToggleDisplay(){
  if(!spectatorVoiceToggleEl)return;
  spectatorVoiceToggleEl.textContent=commentaryEnabled?'🔊 音声 ON':'🔇 音声 OFF';
  spectatorVoiceToggleEl.classList.toggle('muted',!commentaryEnabled);
}
if(spectatorVoiceToggleEl){
  spectatorVoiceToggleEl.addEventListener('click',()=>{
    commentaryEnabled=!commentaryEnabled;
    if(!commentaryEnabled&&'speechSynthesis' in window) window.speechSynthesis.cancel();
    updateVoiceToggleDisplay();
  });
  updateVoiceToggleDisplay();
}
// 同じ状況で喋り続けないよう、直前と同じキーの間は読み上げをスキップする
let aiLastSituation=null;
function aiComment(situationKey,text){
  if(situationKey===aiLastSituation)return;
  aiLastSituation=situationKey;
  aiSpeak(text);
}

// ダイアログ・確認・選択系のモーダルが出ていれば、AI自身が代わりに答えて閉じる
function aiDismissBlockingUI(){
  if(dialogueBox.classList.contains('show')){ hideDialogue(); return true; }
  if(confirmModal.classList.contains('show')){ document.getElementById('confirm-yes').click(); return true; }
  if(dungeonSelectModal.classList.contains('show')){
    const pick=['beginner','normal','advanced'][Math.floor(Math.random()*3)];
    document.getElementById(`dungeon-select-${pick}`).click();
    const phraseKey={beginner:'chooseBeginner',normal:'chooseNormal',advanced:'chooseAdvanced'}[pick];
    aiSpeak(aiPhrase(phraseKey));
    return true;
  }
  if(invModal.classList.contains('show')){ closeInventory(); return true; }
  if(actionModal.classList.contains('show')){ closeActionMenu(); return true; }
  return false;
}

// (tx,ty)方向へのbfsPathの次の一歩へ自機を進める。目標が隣接する敵のマスなら
// moveForward自身の「隣接マスに敵がいれば攻撃する」処理がそのまま働く
function aiStepToward(tx,ty){
  if(state.x===tx&&state.y===ty)return true;
  const path=bfsPath(state.x,state.y,tx,ty);
  if(!path||path.length<2)return false;
  const dx=path[1].x-state.x, dy=path[1].y-state.y;
  const dir=AI_DIR_MAP[`${dx},${dy}`];
  if(dir===undefined)return false;
  state.dir=dir; state.angle=ANGLE_OF[dir]; state.targetAngle=state.angle;
  moveForward(false);
  return true;
}

// 装備中より優れた武器・防具を持っていれば自動装備する
function aiAutoEquip(){
  const betterWeapon=inventory.find(it=>{
    const db=ITEM_DB[it.key];
    return db.type==='weapon'&&!it.equipped&&(!equippedWeapon||(db.atk||0)>(ITEM_DB[equippedWeapon.key].atk||0));
  });
  if(betterWeapon){ selectedItem=betterWeapon; doAction('use'); return betterWeapon.key; }
  const betterArmor=inventory.find(it=>{
    const db=ITEM_DB[it.key];
    return (db.type==='armor'||db.type==='shield')&&!it.equipped&&(!equippedArmor||(db.def||0)>(ITEM_DB[equippedArmor.key].def||0));
  });
  if(betterArmor){ selectedItem=betterArmor; doAction('use'); return betterArmor.key; }
  return null;
}

// 床にある中で優先度の高いアイテム（未所持より強い装備・回復系など）を1つ選ぶ
function aiPickFloorTarget(){
  for(const f of floorItems){
    if(f.key==='gold')return f;
    const db=ITEM_DB[f.key];
    if(!db)continue;
    if(db.type==='weapon'&&(!equippedWeapon||(db.atk||0)>(ITEM_DB[equippedWeapon.key].atk||0)))return f;
    if((db.type==='armor'||db.type==='shield')&&(!equippedArmor||(db.def||0)>(ITEM_DB[equippedArmor.key].def||0)))return f;
    if(db.type==='potion'||db.type==='food'||db.type==='scroll'||db.type==='staff'||db.type==='arrow')return f;
  }
  return null;
}

let aiLastAnnouncedFloor=null;
function aiTick(){
  if(!spectatorMode)return;
  if(isPlayerDown||state.hp<=0)return; // 死亡演出中は何もしない
  if(aiDismissBlockingUI())return;

  if(state.inEntrance){
    aiLastAnnouncedFloor=null;
    aiComment('goto-door',aiPhrase('gotoDoor'));
    aiStepToward(entranceInfo.doorX, entranceInfo.doorY);
    return;
  }

  // フロアが変わったら実況する
  if(aiLastAnnouncedFloor!==state.floor){
    aiLastAnnouncedFloor=state.floor;
    aiSpeak(aiPhrase('floor',state.floor));
  }

  // HPが低ければ回復薬を優先使用
  if(state.hp<=Math.ceil(state.maxHp*0.4)){
    const heal=inventory.find(it=>{
      const db=ITEM_DB[it.key];
      return db.type==='potion'&&db.effect&&db.effect.heal;
    });
    if(heal){
      aiComment('heal',aiPhrase('heal'));
      selectedItem=heal; doAction('use'); return;
    }
  }

  // 気づかれている・隣接している敵がいれば攻撃/接近する
  const target=enemies.find(e=>e.hp>0&&(e.aware||(Math.max(Math.abs(e.x-state.x),Math.abs(e.y-state.y))<=1)));
  if(target){
    aiComment(`fight:${target.x}:${target.y}:${target.monType}`,aiPhrase('engage',aiMonsterName(target.monType)));
    aiStepToward(target.x,target.y); return;
  }

  // より良い装備があれば装備する
  const equipKey=aiAutoEquip();
  if(equipKey){ aiComment(`equip:${equipKey}`,aiPhrase('equip')); return; }

  // 有用な床アイテムがあれば拾いに行く
  const item=aiPickFloorTarget();
  if(item){
    aiComment(`pickup:${item.x}:${item.y}`, item.key==='gold'?aiPhrase('pickupGold'):aiPhrase('pickupItem'));
    aiStepToward(item.x,item.y); return;
  }

  // それ以外は階段へ向かう
  if(stairsPos){
    aiComment(`stairs:${state.floor}`,aiPhrase('stairs'));
    aiStepToward(stairsPos.x,stairsPos.y); return;
  }

  // 何もなければ待機
  doWait();
}

function startSpectatorMode(){
  spectatorMode=true;
  document.body.classList.add('spectator-mode');
  resetFullGameState();
  initEntrance();
  updateCamera();
  hideTitleScreen();
  beginAnimation();
  clearInterval(spectatorTimer);
  spectatorTimer=setInterval(aiTick,400);
  aiLastSituation=null;
  aiLastAnnouncedFloor=null;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  aiSpeak("Welcome! Let's watch the AI play Wanderer's Dungeon.");
}

function stopSpectatorMode(){
  spectatorMode=false;
  document.body.classList.remove('spectator-mode');
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  hideCaption();
  clearInterval(spectatorTimer);
  spectatorTimer=null;
  suspendToTitle();
}

document.getElementById('title-spectator').onclick=()=>{ startSpectatorMode(); };
document.getElementById('spectator-exit').onclick=()=>{ stopSpectatorMode(); };

const titleDebugBtn=document.getElementById('title-debug');
titleDebugBtn.onclick=()=>{
  debugMode=!debugMode;
  titleDebugBtn.textContent=debugMode?'デバッグモード：ON':'デバッグモード：OFF';
  titleDebugBtn.classList.toggle('debug-on',debugMode);
};

titleContinueBtn.onclick=()=>{
  if(!hasAnySaveData())return;
  openSaveSlotModal('continue');
};

titleNewGameBtn.onclick=()=>{
  if(!hasEmptySlot())return;
  openSaveSlotModal('newgame');
};

setTimeout(()=>{
  resizeRenderer();
  refreshTitleSlotButtons();
}, 50);
</script>
