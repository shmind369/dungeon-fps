<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wanderer's Dungeon</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#0a0a0f; overflow:hidden; width:100%; height:100%; }
body { font-family:'Courier New',monospace; color:#c8b89a; user-select:none; -webkit-user-select:none; }

/* 画面表示は「固定仕様」：縦(高さ)を論理解像度で固定し、横幅はその時の実機アスペクト比から
   逆算する（widthScale.jsが起動時・リサイズ時にwidth/height/transform:scaleを計算して設定する）。
   これにより%やvw/vhに頼らず、常に同じ論理ピクセル座標系でレイアウトできる。
   position:fixedな子要素はtransformを持つ祖先を基準にするCSSの仕様を利用し、
   このラッパー自体を最上位の基準にしている。 */
#viewport-root {
  position:fixed; top:0; left:0;
  transform-origin:top left;
  display:flex; flex-direction:column;
  overflow:hidden;
  background:#0a0a0f;
}

/* 上エリア：プレイ画面 */
#game-area {
  position:relative;
  width:100%;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  background:#080810;
}

/* 下エリア：操作パネル。高さは固定値を持たず、実際のdpadサイズ
   （--dp-size/--dp-gap。機種の画面幅に応じてJS側で算出）に応じて
   自動的に決まるようにし、機種によってボタン同士が重なったり
   余白が偏ったりしないようにする */
#ctrl-area {
  flex-shrink:0;
  background:#1a1008;
  border-top:2px solid #4a3418;
  display:flex;
  flex-direction:column;
  padding:12px 8px;
  gap:6px;
}
/* サブボタン行：視点切替・(未定)・ダッシュ・持ち物 */
#sub-btns {
  display:flex; gap:8px; flex-shrink:0;
}
.sub-btn {
  flex:1; height:42px; border-radius:21px;
  background:linear-gradient(#7ac142,#4a8620);
  border:2px solid #3a6a18;
  color:#fff; font-weight:bold; font-size:14px;
  font-family:'Courier New',monospace; cursor:pointer;
  text-shadow:1px 1px 1px rgba(0,0,0,0.4);
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
.sub-btn:active { background:linear-gradient(#5a9c2e,#3a6a18); }
#camera-toggle.active { background:linear-gradient(#4aa0e0,#1a6aa0); border-color:#0e3a5a; }
#dash-btn.dash-on { background:linear-gradient(#9be05a,#5aa02a); border-color:#eaffb0; }
/* 持ち物ボタン：所持数に応じて黄色いゲージが溜まり、満タンで赤くなる */
#sub-inv {
  position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:#1a1008; border-color:#6a5430;
}
#sub-inv:active { background:#1a1008; }
#sub-inv-fill {
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:#f0d000;
  transition:width 0.25s ease, background-color 0.25s ease;
}
#sub-inv-fill.full { background:#e04040; }
.sub-inv-label { position:relative; z-index:1; }
#ctrl-main {
  flex:1 1 auto; min-height:0;
  display:flex; align-items:center; justify-content:space-between;
  gap:6px;
}

#ui { position:absolute; top:0; left:0; right:0; pointer-events:none; z-index:10; }
#topbar {
  display:grid; grid-template-columns:1fr auto 1fr; align-items:flex-start;
  background:none; border:none;
  padding:10px 12px; font-size:22px; color:#fff;
  text-shadow:1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
}
#topbar-left, #topbar-mid { display:flex; flex-direction:column; gap:1px; }
#topbar-left { justify-self:start; }
#topbar-mid { justify-self:center; }
.tb-row { display:flex; align-items:baseline; gap:7px; white-space:nowrap; line-height:25px; }
.tb-label { color:#50e0f0; font-weight:bold; }
/* 右端の階数表示（大きな数字+F） */
#topbar-right { justify-self:end; display:flex; align-items:baseline; white-space:nowrap; }
#floor-num { font-size:41px; font-weight:bold; line-height:1; }
#floor-suffix { font-size:19px; font-weight:bold; margin-left:2px; }
#topbar-right.entrance #floor-num { font-size:13px; }
.stat-bar {
  display:block; width:115px; height:7px;
  background:#000; border:1px solid #000; border-radius:1px;
  margin-bottom:4px; overflow:hidden;
}
.stat-bar-fill {
  display:block; height:100%; width:100%;
  transition:width 0.3s ease, background-color 0.3s ease;
}
#status { display:none; }
#action-label {
  position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  min-width:240px; max-width:94%; box-sizing:border-box;
  background:#000;
  border:2px solid #f8f8f8;
  box-shadow:0 0 0 1px #000818, 0 4px 10px rgba(0,0,0,0.5);
  border-radius:2px;
  padding:9px 18px;
  font-size:14px; letter-spacing:1px; line-height:1.5;
  color:#fff; text-shadow:1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
  text-align:center; white-space:pre-line;
  pointer-events:none; transition:opacity 0.45s ease; z-index:10;
  opacity:0;
}
#guide { display:none; }

/* ダッシュモード表示（右上・ステータスバー下、常時） */
#dash-indicator {
  position:absolute; top:0; right:8px;
  background:rgba(20,60,36,0.85); border:1px solid #40e080; border-radius:4px;
  color:#60ff90; font-size:11px; letter-spacing:1px;
  padding:4px 10px; z-index:11;
  display:none; pointer-events:none;
  text-shadow:0 0 4px rgba(96,255,144,0.5);
}
#dash-indicator.show { display:block; }

/* ターン数表示（テスト用、右上・ステータスバー下） */
#turn-counter {
  position:absolute; right:8px;
  background:rgba(20,20,24,0.6); border:1px solid #4a3a20; border-radius:4px;
  color:#8a7a58; font-size:10px; letter-spacing:1px;
  padding:3px 8px; z-index:11; pointer-events:none;
}

/* 8方向パッド（ボタンサイズはJS側で画面幅に応じて--dp-sizeを計算し、正方形を保ったまま
   できるだけ大きく表示する。狭い機種でも操作パネルからはみ出さないよう自動で縮む） */
#dpad {
  display:grid;
  grid-template-columns:repeat(3,var(--dp-size,68px));
  grid-template-rows:repeat(3,var(--dp-size,68px));
  gap:var(--dp-gap,4px);
  flex-shrink:0;
}
.dp {
  width:var(--dp-size,68px); height:var(--dp-size,68px); border-radius:11px;
  background:#2a1c0c; border:2px solid #6a5430;
  color:#f0d080; font-size:var(--dp-font,24px);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
.dp:active { background:#5a3c1c; border-color:#f0d080; }
/* 各ボタンをグリッド上の固定位置に配置（一人称モードで↙↘を非表示にしても
   他のボタンが詰めて再配置されないようにするため） */
.dp[data-dir="7"] { grid-column:1; grid-row:1; }
.dp[data-dir="0"] { grid-column:2; grid-row:1; }
.dp[data-dir="1"] { grid-column:3; grid-row:1; }
.dp[data-dir="6"] { grid-column:1; grid-row:2; }
.dp[data-dir="-1"] { grid-column:2; grid-row:2; }
.dp[data-dir="2"] { grid-column:3; grid-row:2; }
.dp[data-dir="5"] { grid-column:1; grid-row:3; }
.dp[data-dir="4"] { grid-column:2; grid-row:3; }
.dp[data-dir="3"] { grid-column:3; grid-row:3; }
.dp-turn-icon { width:var(--dp-icon,28px); height:var(--dp-icon,28px); }
.dp-turn-icon.mirror { transform:scaleX(-1); }
.dp-neutral { font-size:var(--dp-neutral-font,15px); color:#a09060; }
.dp-neutral.turn-on { background:#5a3c1c; border-color:#f0d080; color:#f0d080; }

/* 右側の攻撃・空きボタン。誤タップ防止のため間に少し隙間を空けつつ、
   2つ合わせた高さがdpad（3×3）の実際の高さと上下ぴったり揃うようにする */
#right-btns {
  display:flex; flex-direction:column; gap:6px;
  height:calc(var(--dp-size,68px)*3 + var(--dp-gap,4px)*2); flex-shrink:0;
}
#attack-btn {
  width:64px; flex:1; border-radius:10px;
  font-family:'Courier New',monospace; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  background:#3a1414; border:2px solid #8a4030;
  color:#ff9070; font-size:21px; letter-spacing:2px;
}
#attack-btn:active { background:#6a2418; border-color:#ff9070; }

/* 左側の弓矢・空きボタン。誤タップ防止のため間に少し隙間を空けつつ、
   2つ合わせた高さがdpad（3×3）の実際の高さと上下ぴったり揃うようにする */
#left-btns {
  display:flex; flex-direction:column; gap:6px;
  height:calc(var(--dp-size,68px)*3 + var(--dp-gap,4px)*2); flex-shrink:0;
}

/* 弓矢・空きボタンの共通の角丸長方形ボタンスタイル */
#bow-btn, #left-spare-btn {
  width:64px; flex:1; border-radius:12px;
  background:#2a1c0c; border:2px solid #6a5430;
  color:#f0d080; font-size:14px; font-family:'Courier New',monospace;
  cursor:pointer; line-height:1.3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
#bow-btn:active, #left-spare-btn:active { background:#5a3c1c; }
#right-spare-btn {
  width:64px; flex:1; border-radius:10px;
  background:#2a1c0c; border:2px solid #6a5430;
  color:#f0d080; font-size:14px; font-family:'Courier New',monospace;
  cursor:pointer; line-height:1.3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
#right-spare-btn:active { background:#5a3c1c; }
#bow-icon { width:36px; height:36px; }
#bow-count { display:block; font-size:12px; color:#f0d080; margin-top:2px; }

#overlay { position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:20; }

/* モーダル共通 */
#inv-modal, #action-modal {
  position:fixed; inset:0; z-index:40;
  background:rgba(0,0,0,0.6);
  display:none; align-items:center; justify-content:center;
}
#inv-modal.show, #action-modal.show { display:flex; }

#underfoot-modal {
  position:fixed; inset:0; z-index:42;
  background:rgba(0,0,0,0.6);
  display:none; align-items:center; justify-content:center;
}
#underfoot-modal.show { display:flex; }

#dungeon-select-modal {
  position:fixed; inset:0; z-index:43;
  background:rgba(0,0,0,0.6);
  display:none; align-items:center; justify-content:center;
}
#dungeon-select-modal.show { display:flex; }

#settings-modal {
  position:fixed; inset:0; z-index:44;
  background:rgba(0,0,0,0.6);
  display:none; align-items:center; justify-content:center;
}
#settings-modal.show { display:flex; }
#settings-title {
  color:#fff; font-size:23px; text-align:center;
  padding-bottom:15px; border-bottom:1px solid #f8f8f8; margin-bottom:6px;
}
.settings-row { display:flex; flex-direction:column; gap:10px; }
.settings-label-row {
  display:flex; justify-content:space-between; align-items:center;
  color:#fff; font-size:19px;
}
.settings-label-row span:last-child { color:#a0c8ff; font-variant-numeric:tabular-nums; }
.settings-slider {
  -webkit-appearance:none; appearance:none; width:100%; height:6px;
  background:#333; border:1px solid #f8f8f8; border-radius:3px; outline:none;
}
.settings-slider::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none; width:26px; height:26px;
  background:#f8f8f8; border-radius:50%; cursor:pointer;
}
.settings-slider::-moz-range-thumb {
  width:26px; height:26px; background:#f8f8f8; border:none; border-radius:50%; cursor:pointer;
}

#save-slot-modal {
  position:fixed; inset:0; z-index:101;
  background:rgba(0,0,0,0.6);
  display:none; align-items:center; justify-content:center;
}
#save-slot-modal.show { display:flex; }
#save-slot-modal-inner { position:relative; max-width:90%; }
#save-slot-list { display:flex; flex-direction:column; gap:10px; }
#save-slot-list .slot-btn {
  width:100%; background:#000; border:1px solid #f8f8f8; border-radius:3px;
  font-family:'Courier New',monospace; cursor:pointer;
}
#save-slot-list .slot-btn:active { background:#222; }
#save-slot-list .slot-btn:disabled { opacity:0.35; cursor:default; }
#save-slot-action-view { display:none; flex-direction:column; gap:12px; }
#save-slot-action-view.show { display:flex; }
#save-slot-list.hide-for-action { display:none; }
#save-slot-action-summary {
  background:#000; border:1px solid #f8f8f8; border-radius:3px;
}
/* 削除ボタン：持ち物ゲージと同様に、ボタン自体の背景が長押し時間に応じて左から赤く溜まっていく */
#save-slot-delete-btn { position:relative; overflow:hidden; }
#save-slot-delete-btn.arming { border-color:#ff6060; }
#save-slot-delete-fill {
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:#ff4040;
}
#save-slot-delete-label { position:relative; z-index:1; }
#save-slot-delete-warning {
  display:none; color:#ff8080; text-align:center;
  position:absolute; left:50%; top:100%; transform:translateX(-50%);
  margin-top:14px; width:420px; max-width:100%;
}
#save-slot-delete-warning.show { display:block; }
#save-slot-delete-warning-label { font-size:16px; font-weight:bold; letter-spacing:1px; margin-bottom:4px; }
#save-slot-delete-warning-body { font-size:13px; letter-spacing:0.3px; white-space:nowrap; }

#inv-panel {
  width:510px; max-width:660px; max-height:840px;
  background:#000; border:3px solid #f8f8f8; border-radius:3px;
  box-shadow:0 0 0 1px #000818, 0 4px 10px rgba(0,0,0,0.5);
  display:flex; flex-direction:column; overflow:hidden;
}
#inv-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 24px; border-bottom:1px solid #f8f8f8;
  color:#fff; font-size:23px; letter-spacing:3px;
}
#inv-header-left { display:flex; align-items:center; gap:14px; }
#settings-btn {
  background:#000; border:1px solid #f8f8f8; color:#fff;
  font-size:20px; width:38px; height:38px; line-height:1; border-radius:3px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
#settings-btn:active { background:#222; }
#inv-list { overflow-y:auto; padding:12px; flex:1 1 auto; min-height:0; }
.inv-item {
  display:flex; align-items:center; gap:15px;
  padding:15px 18px; margin-bottom:6px;
  background:#000; border:1px solid #444; border-radius:3px;
  cursor:pointer; color:#fff; font-size:21px;
}
.inv-item:active { background:#222; }
.inv-item.equipped { border-color:#f8f8f8; background:#141414; }
.inv-icon { font-size:30px; width:42px; text-align:center; }
.inv-name { flex:1; }
.inv-eq { color:#ffd040; font-weight:bold; font-size:18px; border:1px solid #ffd040; border-radius:5px; padding:2px 8px; }
.inv-plus { color:#80c0ff; font-size:20px; }
.inv-stat { color:#ff9060; font-weight:bold; font-size:18px; border:1px solid #ff9060; border-radius:5px; padding:2px 8px; flex-shrink:0; }
.inv-empty { text-align:center; color:#888; padding:45px; font-size:20px; }

#inv-footer {
  padding:15px 18px; border-top:1px solid #f8f8f8; flex-shrink:0;
  display:flex; flex-direction:column; gap:12px;
}
#inv-footer-row { display:flex; align-items:stretch; gap:12px; }
#inv-underfoot {
  flex:1 1 auto; min-width:0; background:#000; border:1px solid #f8f8f8; color:#fff;
  font-size:20px; letter-spacing:1.5px; padding:17px; border-radius:3px;
  font-family:'Courier New',monospace; cursor:pointer;
  display:flex; align-items:center; gap:15px;
}
#inv-sort, #inv-close {
  flex-shrink:0; background:#000; border:1px solid #f8f8f8; color:#fff;
  font-size:18px; padding:6px 15px; cursor:pointer;
  font-family:'Courier New',monospace; border-radius:3px;
}
#inv-underfoot:active { background:#222; }
#inv-underfoot .uf-label {
  flex-shrink:0; color:#90d080;
  font-size:18px;
}
#inv-underfoot .uf-item { flex:1; text-align:left; color:#fff; }
#inv-underfoot.empty { opacity:0.5; }
#inv-underfoot.empty .uf-item { color:#888; }
#inv-suspend {
  width:100%; background:#000; border:1px solid #f8f8f8; color:#80d0c8;
  font-size:20px; letter-spacing:3px; padding:17px; border-radius:3px;
  font-family:'Courier New',monospace; cursor:pointer;
}
#inv-suspend:active { background:#222; }

/* 交換：所持アイテム選択モーダル（インベントリと同じ見た目のリストを流用） */
#swap-modal {
  position:fixed; inset:0; z-index:44;
  background:rgba(0,0,0,0.6);
  display:none; align-items:center; justify-content:center;
}
#swap-modal.show { display:flex; }
#swap-panel {
  width:510px; max-width:660px; max-height:840px;
  background:#000; border:3px solid #f8f8f8; border-radius:3px;
  box-shadow:0 0 0 1px #000818, 0 4px 10px rgba(0,0,0,0.5);
  display:flex; flex-direction:column; overflow:hidden;
}
#swap-header {
  padding:18px 24px; border-bottom:1px solid #f8f8f8;
  color:#fff; font-size:22px; letter-spacing:2px; text-align:center;
}
#swap-list { overflow-y:auto; padding:12px; flex:1 1 auto; min-height:0; }
#swap-footer { padding:15px 18px; border-top:1px solid #f8f8f8; flex-shrink:0; }
#swap-cancel {
  width:100%; background:#000; border:1px solid #f8f8f8; color:#a0a0a0;
  font-size:20px; padding:17px; border-radius:3px;
  font-family:'Courier New',monospace; cursor:pointer;
}
#swap-cancel:active { background:#222; }

/* アクションメニュー */
#action-panel, .action-panel-box {
  width:420px; max-width:480px;
  background:#000; border:3px solid #f8f8f8; border-radius:3px;
  box-shadow:0 0 0 1px #000818, 0 4px 10px rgba(0,0,0,0.5);
  padding:24px; display:flex; flex-direction:column; gap:12px;
}
#action-title, #underfoot-title, #dungeon-select-title, #save-slot-title {
  color:#fff; font-size:23px; text-align:center;
  padding-bottom:15px; border-bottom:1px solid #f8f8f8; margin-bottom:6px;
}
#action-desc, #underfoot-desc {
  color:#b0b0b0; font-size:16px; line-height:1.5;
  margin-top:-8px; margin-bottom:2px;
}
#action-desc:empty, #underfoot-desc:empty { display:none; margin:0; }
.act-btn-row {
  display:flex; flex-direction:row; gap:12px;
}
.act-btn-row .act-btn { flex:1; min-width:0; padding:18px 6px; }
.act-btn {
  background:#000; border:1px solid #f8f8f8; color:#fff;
  font-size:21px; padding:18px; cursor:pointer; border-radius:3px;
  font-family:'Courier New',monospace;
}
.act-btn[data-act="cancel"], .act-btn[data-uf="cancel"] { color:#a0a0a0; }
.act-btn[data-uf="pick"] { color:#90d080; }
.act-btn:active { background:#222; }
.act-btn:disabled { color:#666; cursor:default; }
.act-btn:disabled:active { background:#000; }
#dungeon-select-cancel { color:#a0a0a0; }

/* 確認モーダル（YES/NO） */
#confirm-modal {
  position:fixed; inset:0; z-index:45;
  background:rgba(0,0,0,0.65);
  display:none; align-items:center; justify-content:center;
}
#confirm-modal.show { display:flex; }
#confirm-panel {
  width:360px; max-width:450px;
  background:#000; border:3px solid #f8f8f8; border-radius:3px;
  box-shadow:0 0 0 1px #000818, 0 4px 10px rgba(0,0,0,0.5);
  padding:27px; display:flex; flex-direction:column; gap:15px;
}
#confirm-title {
  color:#fff; font-size:23px; text-align:center;
  padding-bottom:15px; border-bottom:1px solid #f8f8f8; margin-bottom:6px;
  line-height:1.5;
}
.confirm-btn {
  background:#000; border:1px solid #f8f8f8; color:#fff;
  font-size:21px; padding:18px; cursor:pointer; border-radius:3px;
  font-family:'Courier New',monospace;
}
.confirm-btn:active { background:#222; }
#confirm-yes { color:#80e090; }
#confirm-no { color:#a0a0a0; }

/* セリフウィンドウ */
#dialogue-box {
  position:absolute; left:10px; right:10px; bottom:10px;
  background:#000; border:2px solid #f8f8f8; border-radius:2px;

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// 画面表示の「固定仕様」：縦(高さ)を論理解像度で固定し、横幅はその時の実機アスペクト比から逆算する。
// スマホの画面比率を想定した作りなので、横幅がMAX_LOGICAL_WIDTHを超える横長画面
// （PCのブラウザなど）ではスマホ相当の横幅で頭打ちにし、左右をレターボックス（黒帯）にして
// 中央に表示する。スマホ本来の縦長画面では従来通り黒帯なしで画面いっぱいに表示される。
// HUDやボタンは全てこの論理座標系上の絶対px値で配置されているため、機種が変わっても見た目の比率は変わらない。
const LOGICAL_HEIGHT=844; // 基準論理解像度（6.1インチ相当）
const MAX_LOGICAL_WIDTH=520; // スマホの横幅として想定する上限
// スマートフォンのブラウザはアドレスバーの表示/収縮でwindow.innerHeightが
// 実際の表示領域と一瞬ズレることがあり、それを引きずると下部に黒い余白が残ってしまう。
// visualViewportが使える環境ではそちらの値を優先し、実際に見えている領域に正確に合わせる。
function getRealViewportSize(){
  if(window.visualViewport){
    return { w:window.visualViewport.width, h:window.visualViewport.height };
  }
  return { w:window.innerWidth, h:window.innerHeight };
}
function applyFixedViewport(){
  const root=document.getElementById('viewport-root');
  if(!root)return;
  const {w:realW,h:realH}=getRealViewportSize();
  const scale=realH/LOGICAL_HEIGHT;
  const logicalW=Math.min(realW/scale,MAX_LOGICAL_WIDTH);
  root.style.width=logicalW+'px';
  root.style.height=LOGICAL_HEIGHT+'px';
  root.style.transform=`scale(${scale})`;
  // 横幅を頭打ちにした分だけ余白ができる場合は、左右中央に寄せる（余白は黒帯として見える）
  const renderedW=logicalW*scale;
  root.style.left=((realW-renderedW)/2)+'px';
  updateDpadSize(logicalW);
}
// 方向パッドのボタンサイズを画面幅に応じて計算する。
// 比率0.1987は実機スクリーンショット(926x1699、セル幅約184px)から算出した目標比率で、
// 余裕がある機種ではこの比率に近いサイズまで大きく表示する。
// ただし操作パネルからはみ出さないよう、実際に使える横幅から逆算した上限も必ず守る。
const DPAD_RATIO=0.1987;
const DPAD_MIN=62, DPAD_MAX=100;
function updateDpadSize(logicalW){
  const ctrlPaddingH=16, ctrlGapH=12, sideBtnW=64*2, dpGap=4; // #ctrl-areaの現在のCSS値と合わせる
  const available=logicalW-ctrlPaddingH-ctrlGapH-sideBtnW;
  const byRatio=logicalW*DPAD_RATIO;
  const byAvailable=(available-dpGap*2)/3;
  let size=Math.min(byRatio,byAvailable);
  size=Math.max(DPAD_MIN,Math.min(DPAD_MAX,size));
  const root=document.documentElement.style;
  root.setProperty('--dp-size',size+'px');
  root.setProperty('--dp-gap',dpGap+'px');
  root.setProperty('--dp-font',Math.round(size*0.353)+'px');
  root.setProperty('--dp-icon',Math.round(size*0.412)+'px');
  root.setProperty('--dp-neutral-font',Math.round(size*0.221)+'px');
}
applyFixedViewport();
// アドレスバーの収縮などブラウザUIの変化はwindow.resizeを取りこぼすことがあるため、
// 対応環境ではvisualViewportのresize/scrollでも再計算する
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', applyFixedViewport);
  window.visualViewport.addEventListener('scroll', applyFixedViewport);
}
// 読み込み直後はブラウザUIの状態がまだ確定していないことがあるため、少し遅れて再計算しておく
setTimeout(applyFixedViewport,300);
setTimeout(applyFixedViewport,1000);

const P={TAP_MAX:150,ROT_START:150,SWIPE_DIST:50,ROT_SPEED:3,CHARGE_TIME:1500,CAM_DIST:4,CAM_H:4};
if(typeof THREE==='undefined'){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;top:120px;left:10px;right:10px;background:#600;color:#fff;padding:14px;z-index:99999;font-size:14px;font-family:monospace;';
  d.textContent='THREE.jsの読み込みに失敗しました。ネットワーク接続を確認してリロードしてください。';
  document.body.appendChild(d);
  throw new Error('THREE not loaded');
}

const ENEMY_SCALE=1.3*1.2; // 敵オブジェクトの基本スケール（従来の1.2倍）
const RETURN_FLOORS=[]; // 帰還スポットは一旦廃止
// 階層別モンスター出現プール
const FLOOR_MONSTER_POOL={
  1:['slime','bat'],2:['slime','bat'],

// 音量設定（BGM/効果音を個別に0〜100%で調整可能。端末に永続保存する）
let gameSettings={bgmVolume:1, sfxVolume:0.3};
function loadSettings(){
  try{
    const saved=JSON.parse(localStorage.getItem('rg_settings')||'null');
    if(saved){
      if(typeof saved.bgmVolume==='number') gameSettings.bgmVolume=Math.min(1,Math.max(0,saved.bgmVolume));
      if(typeof saved.sfxVolume==='number') gameSettings.sfxVolume=Math.min(1,Math.max(0,saved.sfxVolume));
    }
  }catch(e){}
}
function saveSettings(){
  try{ localStorage.setItem('rg_settings', JSON.stringify(gameSettings)); }catch(e){}
}

let actx=null;
function getAudioCtx(){
  if(!actx){
    try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ console.warn('AudioContext を初期化できませんでした',e); }
  }
  // モバイルではユーザー操作前は再生できないため、そのつど再開を試みる
  if(actx&&actx.state==='suspended'){ actx.resume().catch(()=>{}); }
  return actx;
}
// 全効果音の出力をまとめる共通ゲイン（効果音音量スライダーで一括制御するため）
let sfxMasterGain=null;
function sfxDest(ctx){
  if(!sfxMasterGain){
    sfxMasterGain=ctx.createGain();
    sfxMasterGain.gain.value=gameSettings.sfxVolume;
    sfxMasterGain.connect(ctx.destination);
  }
  return sfxMasterGain;
}
// 初回のタップ/クリックでAudioContextを確実にアンロックする
function unlockAudioOnce(){
  getAudioCtx();
  window.removeEventListener('touchstart',unlockAudioOnce);
  window.removeEventListener('mousedown',unlockAudioOnce);
}
window.addEventListener('touchstart',unlockAudioOnce,{passive:true});
window.addEventListener('mousedown',unlockAudioOnce);

// ノイズバッファ（一度だけ生成して使い回す）
let noiseBuffer=null;
function getNoiseBuffer(ctx){
  if(noiseBuffer)return noiseBuffer;
  const len=ctx.sampleRate*0.5;
  noiseBuffer=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=noiseBuffer.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return noiseBuffer;
}

// 自機→敵への攻撃「バシュッ」：ノイズにバンドパスを掛けて素早く下げる
function sfxAttack(){
  const ctx=getAudioCtx(); if(!ctx)return;
  const now=ctx.currentTime;
  const src=ctx.createBufferSource(); src.buffer=getNoiseBuffer(ctx);
  const bp=ctx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(3200,now);
  bp.frequency.exponentialRampToValueAtTime(700,now+0.12);
  bp.Q.value=1.1;
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(0.5,now+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.14);
  src.connect(bp); bp.connect(gain); gain.connect(sfxDest(ctx));
  src.start(now); src.stop(now+0.16);
}

// 何もない場所への素振り「シュッ」：命中音より短く軽く高め（衝撃感を出さない）
function sfxSwing(){
  const ctx=getAudioCtx(); if(!ctx)return;
  const now=ctx.currentTime;
  const src=ctx.createBufferSource(); src.buffer=getNoiseBuffer(ctx);
  const bp=ctx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(4200,now);
  bp.frequency.exponentialRampToValueAtTime(1800,now+0.08);
  bp.Q.value=0.8;
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(0.28,now+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.09);
  src.connect(bp); bp.connect(gain); gain.connect(sfxDest(ctx));
  src.start(now); src.stop(now+0.1);
}

// 敵→自機への被弾「ドンっ」：低音のサイン波+ノイズの衝撃
function sfxHit(){
  const ctx=getAudioCtx(); if(!ctx)return;
  const now=ctx.currentTime;
  // 低音の「ドン」本体
  const osc=ctx.createOscillator(); osc.type='sine';
  osc.frequency.setValueAtTime(150,now);
  osc.frequency.exponentialRampToValueAtTime(48,now+0.18);
  const oGain=ctx.createGain();

// ============================================================
// ダンジョンBGM（効果音と同じくWeb Audio APIでその場で合成。音声ファイル不要）
// ============================================================
function midiToFreq(m){return 440*Math.pow(2,(m-69)/12);}
// トラックごとにコード進行・テンポ・音色を変えて雰囲気を差別化する。
// いずれもコード配列を巡回するだけの単純な構造なので、末尾から先頭へ継ぎ目なく自然にループする。
// 初級：Dナチュラルマイナー i(Dm)-VI(Bb)-III(F)-VII(C)。落ち着いたテンポの基本パターン
// 中級：Aマイナーのアンダルシア終止 i(Am)-VII(G)-VI(F)-V(E) で、V→iの解決感を出しつつ緊張感のある雰囲気にする
// 上級：Gナチュラルマイナー主体 i(Gm)-v(Dm)-VI(Eb)-iv(Cm) で、短調の和音を重ねて中級より重く冷たい雰囲気にする
// ボス戦：Eハーモニックマイナーの i(Em)-VI(C)-VII(D)-V(B) で、V→iの解決感を保ちつつテンポと音色で緊迫感を出す
// BGM全体の基準音量（効果音に対して控えめになるよう、以前の0.6より少し下げてある）
// ※ 従来のデフォルト音量(bgmVolume=0.3)をスライダーの100%として扱うため、
//    その分(0.3倍)基準ゲインを下げてある。実際の聴感上の音量は変更前と同じ。
const BGM_BASE_GAIN=0.45*0.3;
const BGM_TRACKS={
  beginner:{
    chords:[
      {bassMidi:50, tones:[62,65,69,74]}, // Dm: D3 bass / D4-F4-A4-D5
      {bassMidi:46, tones:[58,62,65,70]}, // Bb: Bb2 bass / Bb3-D4-F4-Bb4
      {bassMidi:53, tones:[65,69,72,77]}, // F : F3 bass / F4-A4-C5-F5
      {bassMidi:48, tones:[60,64,67,72]}, // C : C3 bass / C4-E4-G4-C5
    ],
    arpPattern:[0,1,2,3,2,1,0,1], arpType:'sine', tempo:78, delayTime:0.28,
  },
  normal:{
    chords:[
      {bassMidi:45, tones:[57,60,64,69]}, // Am: A2 bass / A3-C4-E4-A4
      {bassMidi:43, tones:[55,59,62,67]}, // G : G2 bass / G3-B3-D4-G4
      {bassMidi:41, tones:[53,57,60,65]}, // F : F2 bass / F3-A3-C4-F4
      {bassMidi:40, tones:[52,56,59,64]}, // E : E2 bass / E3-G#3-B3-E4（ハーモニックにVを効かせる）
    ],
    arpPattern:[0,2,1,3,1,2,0,3], arpType:'triangle', tempo:90, delayTime:0.22,
  },
  advanced:{
    chords:[
      {bassMidi:43, tones:[55,58,62,67]}, // Gm: G2 bass / G3-Bb3-D4-G4
      {bassMidi:38, tones:[50,53,57,62]}, // Dm: D2 bass / D3-F3-A3-D4
      {bassMidi:39, tones:[51,55,58,63]}, // Eb: Eb2 bass / Eb3-G3-Bb3-Eb4
      {bassMidi:36, tones:[48,51,55,60]}, // Cm: C2 bass / C3-Eb3-G3-C4
    ],
    arpPattern:[0,1,2,1,3,1,2,1], arpType:'square', tempo:84, delayTime:0.34,
    volumeMul:0.5, // 上級ダンジョンのBGM音量を半分程度に抑える
  },
  boss:{
    chords:[
      {bassMidi:40, tones:[52,55,59,64]}, // Em: E2 bass / E3-G3-B3-E4
      {bassMidi:36, tones:[48,52,55,60]}, // C : C2 bass / C3-E3-G3-C4
      {bassMidi:38, tones:[50,54,57,62]}, // D : D2 bass / D3-F#3-A3-D4
      {bassMidi:47, tones:[59,63,66,71]}, // B : B2 bass / B3-D#4-F#4-B4（ハーモニックマイナーのVで緊張を強める）
    ],
    arpPattern:[0,1,2,3,3,2,1,0], arpType:'sawtooth', tempo:116, delayTime:0.16,
    volumeMul:0.25, // 他のBGMより音圧が大きく感じられるため、基準音量をさらに絞る
  },
};
let bgmPlaying=false, bgmSchedulerTimer=null, bgmNextNoteTime=0, bgmChordIndex=0, bgmBarsInChord=0;
let bgmMaster=null, bgmTrack=null, bgmBeat=0, bgmEighth=0;

function bgmPlayTone(ctx,dest,freq,startTime,dur,type,peakGain,attack,release){
  const osc=ctx.createOscillator(); osc.type=type; osc.frequency.value=freq;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0,startTime);
  g.gain.linearRampToValueAtTime(peakGain,startTime+attack);
  g.gain.setValueAtTime(peakGain,startTime+dur-release);
  g.gain.linearRampToValueAtTime(0,startTime+dur);
  osc.connect(g).connect(dest);
  osc.start(startTime); osc.stop(startTime+dur+0.05);
}
function bgmPlayThump(ctx,dest,startTime){
  const src=ctx.createBufferSource(); src.buffer=getNoiseBuffer(ctx);
  const filt=ctx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=120;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.25,startTime);
  g.gain.exponentialRampToValueAtTime(0.001,startTime+0.35);
  src.connect(filt).connect(g).connect(dest);
  src.start(startTime); src.stop(startTime+0.4);
}
function bgmScheduleBar(ctx,master,delayNode){
  const chord=bgmTrack.chords[bgmChordIndex];
  // 低音はスマホ等の小型スピーカーでは聞こえにくいため、1オクターブ上を重ねて可聴性を確保
  bgmPlayTone(ctx,master,midiToFreq(chord.bassMidi),bgmNextNoteTime,bgmBeat*4*0.95,'triangle',0.22,0.05,0.3);
  bgmPlayTone(ctx,master,midiToFreq(chord.bassMidi+12),bgmNextNoteTime,bgmBeat*4*0.95,'triangle',0.12,0.05,0.3);
  bgmPlayThump(ctx,master,bgmNextNoteTime);
  for(let i=0;i<8;i++){
    const freq=midiToFreq(chord.tones[bgmTrack.arpPattern[i]]);
    const t=bgmNextNoteTime+i*bgmEighth;
    bgmPlayTone(ctx,delayNode,freq,t,bgmEighth*0.9,bgmTrack.arpType,0.13,0.01,0.08);
  }
  bgmNextNoteTime+=bgmBeat*4;
  bgmBarsInChord++;
  if(bgmBarsInChord>=2){bgmBarsInChord=0; bgmChordIndex=(bgmChordIndex+1)%bgmTrack.chords.length;}
}
function startBGM(trackKey){
  const ctx=getAudioCtx(); if(!ctx||bgmPlaying)return;
  if(ctx.state==='suspended'){ ctx.resume().catch(()=>{}); }
  bgmTrack=BGM_TRACKS[trackKey]||BGM_TRACKS.beginner;
  bgmBeat=60/bgmTrack.tempo; bgmEighth=bgmBeat/2;
  bgmPlaying=true;
  bgmMaster=ctx.createGain(); bgmMaster.gain.value=BGM_BASE_GAIN*gameSettings.bgmVolume*(bgmTrack.volumeMul||1);
  bgmMaster.connect(ctx.destination);
  const delayNode=ctx.createDelay(); delayNode.delayTime.value=bgmTrack.delayTime;
  const feedback=ctx.createGain(); feedback.gain.value=0.32;
  const delayGain=ctx.createGain(); delayGain.gain.value=0.6;
  delayNode.connect(feedback).connect(delayNode);
  delayNode.connect(delayGain).connect(bgmMaster);
  delayNode.connect(bgmMaster);
  bgmNextNoteTime=ctx.currentTime+0.1; bgmChordIndex=0; bgmBarsInChord=0;
  bgmSchedulerTimer=setInterval(()=>{
    while(bgmNextNoteTime<ctx.currentTime+0.2){ bgmScheduleBar(ctx,bgmMaster,delayNode); }
  },25);
}
function stopBGM(){
  if(!bgmPlaying)return;
  bgmPlaying=false;
  clearInterval(bgmSchedulerTimer); bgmSchedulerTimer=null;
  if(bgmMaster){
    const ctx=getAudioCtx();
    if(ctx){ bgmMaster.gain.linearRampToValueAtTime(0,ctx.currentTime+0.6); }
    const m=bgmMaster; bgmMaster=null;
    setTimeout(()=>{ try{ m.disconnect(); }catch(e){} },700);
  }
}

// WebGLコンテキストロスト対策
// バックグラウンド化などでブラウザがGPUリソースを回収すると、
// エラーは出ないまま描画だけが真っ黒になることがある。検知して自動復旧する。
let contextWasLost=false;
renderer.domElement.addEventListener('webglcontextlost', (e)=>{
  e.preventDefault();
  contextWasLost=true;
  console.warn('[WebGL] コンテキストが失われました。復元を待機します');
}, false);
renderer.domElement.addEventListener('webglcontextrestored', ()=>{
  console.warn('[WebGL] コンテキストが復元されました。シーンを再構築します');
  try{
    if(typeof rebuildCurrentScene==='function') rebuildCurrentScene();
  }catch(err){
    console.error('[WebGL] シーン再構築に失敗しました',err);
  }
  contextWasLost=false;
}, false);
// タブに戻ってきたタイミングでもコンテキストの状態を確認し、
// 万一イベントを取りこぼしていても復旧できるようにする
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && renderer.getContext && renderer.getContext().isContextLost && renderer.getContext().isContextLost()){
    console.warn('[WebGL] 復帰時にコンテキストロストを検知しました');

});

function acquirePooledLight(color,intensity,distance){
  const lt=lightPool[lightPoolCursor];
  lightPoolCursor=(lightPoolCursor+1)%LIGHT_POOL_SIZE;
  lt.color.setHex(color);
  lt.intensity=intensity;
  lt.distance=distance;
  return lt;
}
function releasePooledLight(lt){
  if(lt)lt.intensity=0;
}

// フロア切り替え時にシーンから外すオブジェクトのgeometry/materialを解放する。
// 呼ばないとGPU上のメモリが解放されず、長時間プレイするほど重くなっていく。
// テクスチャ（material.map）は各種getXxxTexture()でキャッシュ・使い回しされて
// いるため、ここでは解放しない（解放すると次のフロアで再利用できなくなる）
function disposeObject3D(obj){
  obj.traverse(node=>{
    if(node.geometry)node.geometry.dispose();
    if(node.material){
      const mats=Array.isArray(node.material)?node.material:[node.material];
      mats.forEach(m=>m.dispose());
    }
  });
}

function updateHighlight(show){
  if(show){
    const px=playerGroup.position.x, pz=playerGroup.position.z;
    const len=CELL*8;
    // 斜め方向はDIR_DX/DIR_DYの長さが√2になるため、正規化してから使う
    // （正規化しないと斜め方向だけ中心が遠くにずれ、線が自機の位置から出なくなる）
    const rawX=DIR_DX[state.dir], rawZ=DIR_DY[state.dir];
    const mag=Math.hypot(rawX,rawZ)||1;
    const ux=rawX/mag, uz=rawZ/mag;
    // 線の中心を自機から向き方向へ半分ずらす
    const cx=px+ux*len/2;
    const cz=pz+uz*len/2;
    guideLine.position.set(cx,0.4,cz);
    // 向きに合わせて回転（Z軸が長辺）
    guideLine.rotation.y=Math.atan2(ux,uz);
    guideLine.material.opacity=0.8;
  } else {
    guideLine.material.opacity=0.0;
  }
}

// 部屋にいれば同室のオブジェクトを表示、通路なら隣接1マスのみ表示
function updateObjectVisibility(){
  if(state.inEntrance){
    // エントランスは常に全て見える
    enemies.forEach(e=>{ if(e.mesh)e.mesh.visible=true; });
    floorItems.forEach(i=>{ if(i.mesh)i.mesh.visible=true; });
    objectMeshes.forEach(m=>{ m.visible=true; });
    return;
  }
  const myRoom=rooms.find(r=>state.x>=r.x&&state.x<r.x+r.w&&state.y>=r.y&&state.y<r.y+r.h);
  function visibleAt(gx,gy){
    if(gx===undefined||gy===undefined)return true;
    if(myRoom){
      // 同じ部屋の中なら見える
      if(gx>=myRoom.x&&gx<myRoom.x+myRoom.w&&gy>=myRoom.y&&gy<myRoom.y+myRoom.h)return true;
    }
    // 隣接1マス（斜め含む）なら見える
    if(Math.abs(gx-state.x)<=1&&Math.abs(gy-state.y)<=1)return true;
    return false;
  }
  // 敵
  enemies.forEach(e=>{ if(e.mesh)e.mesh.visible=visibleAt(e.x,e.y); });
  // アイテム
  floorItems.forEach(i=>{ if(i.mesh)i.mesh.visible=visibleAt(i.x,i.y); });
  // 階段・帰還など（userDataにgx/gyを持つobjectMeshes）
  objectMeshes.forEach(m=>{
    if(m.userData&&m.userData.gx!==undefined){
      m.visible=visibleAt(m.userData.gx,m.userData.gy);
    }
  });
}

// 最短経路での角度差（-PI〜PIに正規化）
function angleDiff(a,b){
  let d=(b-a)%(Math.PI*2);
  if(d>Math.PI)d-=Math.PI*2;
  if(d<-Math.PI)d+=Math.PI*2;
  return d;
}
// 表示上の向き(state.angle)を目標(state.targetAngle)へ滑らかに近づける（一人称その場旋回用の中割り）
function updatePlayerAngleSmooth(dt){
  const diff=angleDiff(state.angle,state.targetAngle);
  if(Math.abs(diff)<0.001){
    state.angle=state.targetAngle;
  }else{
    const k=Math.min(dt*7,1);
    state.angle+=diff*k;
  }
  playerGroup.rotation.y=-state.angle+Math.PI/2;
}
// 表示座標を論理座標へ滑らかに近づける
function updatePlayerSmooth(dt){
  const tx=state.x*CELL, tz=state.y*CELL;
  const k=Math.min(dt*5,1); // 補間速度（小さいほど滑らか）
  // カメラは攻撃突進などの演出モーションを無視し、論理座標だけを追従する
  camX+=(tx-camX)*k;
  camZ+=(tz-camZ)*k;
  // 突進アニメ中はそちらに任せる（干渉回避）
  if(anims.some(a=>a.mesh===playerGroup))return;
  playerGroup.position.x+=(tx-playerGroup.position.x)*k;
  playerGroup.position.z+=(tz-playerGroup.position.z)*k;
}
// 敵の表示座標も自機と同様に論理座標へ滑らかに近づける
function updateEnemiesSmooth(dt){
  const k=Math.min(dt*7,1);
  enemies.forEach(e=>{
    if(e.hp<=0)return;
    // 突進アニメ中はそちらに任せる（干渉回避）
    if(anims.some(a=>a.mesh===e.mesh))return;
    const tx=e.x*CELL, tz=e.y*CELL;
    e.mesh.position.x+=(tx-e.mesh.position.x)*k;
    e.mesh.position.z+=(tz-e.mesh.position.z)*k;
  });
}

// マップ生成
function generateMap(floor){
  const m=Array.from({length:MAP_H},()=>Array(MAP_W).fill(1));
  const rs=[];

  // 10Fは1部屋のみ（ボス部屋）
  if(floor===10){
    const rw=16,rh=16;
    const rx=Math.floor((MAP_W-rw)/2),ry=Math.floor((MAP_H-rh)/2);
    for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++)m[y][x]=0;
    rs.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
    return{cells:m,rooms:rs};
  }

  let cnt;
  if(state.dungeonType==='beginner'&&BEGINNER_ROOM_COUNT[floor]){
    const [lo,hi]=BEGINNER_ROOM_COUNT[floor];
    cnt=lo+Math.floor(Math.random()*(hi-lo+1));
  } else {
    cnt=4+Math.floor(Math.random()*3);
  }
  for(let att=0;att<300&&rs.length<cnt;att++){
    const rw=4+Math.floor(Math.random()*6),rh=4+Math.floor(Math.random()*6);
    const rx=1+Math.floor(Math.random()*(MAP_W-rw-2)),ry=1+Math.floor(Math.random()*(MAP_H-rh-2));
    if(rs.some(r=>rx<=r.x+r.w+1&&rx+rw+1>=r.x&&ry<=r.y+r.h+1&&ry+rh+1>=r.y))continue;
    for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++)m[y][x]=0;
    rs.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
  }
  for(let i=1;i<rs.length;i++){
    const a=rs[i-1],b=rs[i];let cx=a.cx,cy=a.cy;
    while(cx!==b.cx){m[cy][cx]=0;cx+=cx<b.cx?1:-1;}
    while(cy!==b.cy){m[cy][cx]=0;cy+=cy<b.cy?1:-1;}
  }
  // 別々の部屋間通路がたまたま隣接して2マス幅に見えてしまう箇所を、
  // 全体の連結性を保ったまま1マス幅に間引く
  thinWideCorridors(m,rs,MAP_W,MAP_H);
  // どの部屋にも繋がらない行き止まりの通路（枝分かれの先端）を除去する
  pruneDeadEndCorridors(m,rs,MAP_W,MAP_H);
  return{cells:m,rooms:rs};
}

// 部屋の外にある通路マスのうち、隣接する通路/部屋が1つ以下（＝行き止まり）のものを
// 壁に戻す。行き止まりは接続の要にはなり得ないため、連結性を損なわず安全に除去できる
function pruneDeadEndCorridors(m,rooms,W,H){
  function inAnyRoom(x,y){ return rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h); }
  let changed=true,guard=0;
  while(changed&&guard<3000){
    changed=false;guard++;
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        if(m[y][x]!==0||inAnyRoom(x,y))continue;
        let deg=0;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
          const nx=x+dx,ny=y+dy;
          if(nx>=0&&nx<W&&ny>=0&&ny<H&&m[ny][nx]===0)deg++;
        });
        if(deg<=1){ m[y][x]=1; changed=true; }
      }
    }
  }
}

// 通路が偶然重なって2マス以上の幅になっている箇所を検出し、
// 部屋同士の連結性（通行可能性）を崩さない範囲で1マス幅に間引く
function thinWideCorridors(m,rooms,W,H){
  function inAnyRoom(x,y){ return rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h); }
  function isFloor(x,y){ return x>=0&&x<W&&y>=0&&y<H&&m[y][x]===0; }
  function countComponents(){
    const seen=Array.from({length:H},()=>Array(W).fill(false));
    let comps=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      if(m[y][x]!==0||seen[y][x])continue;
      comps++;
      const stack=[[x,y]];seen[y][x]=true;
      while(stack.length){
        const [cx,cy]=stack.pop();
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
          const nx=cx+dx,ny=cy+dy;
          if(isFloor(nx,ny)&&!seen[ny][nx]){seen[ny][nx]=true;stack.push([nx,ny]);}
        });
      }
    }
    return comps;
  }
  const baseComps=countComponents();
  let changed=true,guard=0;
  while(changed&&guard<2000){
    changed=false;guard++;
    for(let y=0;y<H&&!changed;y++){
      for(let x=0;x<W&&!changed;x++){
        if(m[y][x]!==0||inAnyRoom(x,y))continue;
        // このマスを左上とする2x2が全て通路（部屋外の床）なら幅2以上とみなす
        if(isFloor(x+1,y)&&!inAnyRoom(x+1,y)&&isFloor(x,y+1)&&!inAnyRoom(x,y+1)&&isFloor(x+1,y+1)&&!inAnyRoom(x+1,y+1)){
          for(const [tx,ty] of [[x+1,y+1],[x+1,y],[x,y+1],[x,y]]){
            m[ty][tx]=1;
            if(countComponents()===baseComps){changed=true;break;}
            m[ty][tx]=0; // 連結性が崩れる場合は元に戻して次の候補を試す
          }
        }
      }
    }
  }
}
function rndInRoom(r){return{x:r.x+1+Math.floor(Math.random()*Math.max(1,r.w-2)),y:r.y+1+Math.floor(Math.random()*Math.max(1,r.h-2))};}

// エントランス固定マップ生成（縦15x横7の本体 + 4部屋7x7）
function generateEntranceMap(){
  const m=Array.from({length:MAP_H},()=>Array(MAP_W).fill(1));
  const rs=[];

  // オフセット（マップ中央寄りに配置）
  const OX=3, OY=7;

  // エントランス本体：横7 x 縦7（倉庫・スペースの部屋と下端を揃える）
  const cx0=OX+7+1; // 左部屋(7)+通路(1)
  const cy0=OY;
  const cw=7, ch=7;
  for(let y=cy0;y<cy0+ch;y++)for(let x=cx0;x<cx0+cw;x++)m[y][x]=0;
  const centerRoom={x:cx0,y:cy0,w:cw,h:ch,cx:cx0+3,cy:cy0+3,id:'center'};
  rs.push(centerRoom);

  // 2部屋（各7x7）：倉庫とスペース
  const leftX=OX, rightX=cx0+cw+1;
  const topY=OY;

  const storageRoom={x:leftX,y:topY,w:7,h:7,cx:leftX+3,cy:topY+3,id:'storage'};
  const spaceRoom  ={x:rightX,y:topY,w:7,h:7,cx:rightX+3,cy:topY+3,id:'space'};
  [storageRoom,spaceRoom].forEach(r=>{
    for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)m[y][x]=0;
    rs.push(r);
  });

  // 通路で接続（各部屋の中心行からエントランス本体まで一直線）
  function carveH(y,xFrom,xTo){const s=Math.min(xFrom,xTo),e=Math.max(xFrom,xTo);for(let x=s;x<=e;x++)m[y][x]=0;}
  carveH(storageRoom.cy, storageRoom.x+storageRoom.w-1, cx0); // 倉庫→本体
  carveH(spaceRoom.cy,   cx0+cw-1, spaceRoom.x);              // 本体→スペース

  return{cells:m,rooms:rs, doorX:cx0+3, doorY:cy0, startX:cx0+3, startY:cy0+ch-4,
    storageRoom, spaceRoom, centerRoom};
}

// ダンジョン構築
function buildDungeon(){
  const fGeo=new THREE.PlaneGeometry(CELL,CELL);
  const cGeo=new THREE.PlaneGeometry(CELL,CELL);
  const wGeo=new THREE.BoxGeometry(CELL,WALL_H,0.12);
  const bGeo=new THREE.BoxGeometry(CELL,WALL_H,CELL);
  // フロアの深度帯ごとにダンジョンらしい壁テクスチャを貼る（エントランスは従来通り単色）
  const useWallTexture=!state.inEntrance;
  let texturedWallMat=null;
  if(useWallTexture){
    const tex=getWallTextureForFloor(state.floor);
    // 7〜8Fの洞窟壁は、石一つ一つが約5倍大きく見えるようリピート数を減らす
    const isCaveFloor=state.floor>6&&state.floor<=8;
    tex.repeat.set(isCaveFloor?3/5:3, isCaveFloor?4/5:4);
    texturedWallMat=new THREE.MeshLambertMaterial({map:tex});
  }
  const wMat=()=>useWallTexture?texturedWallMat:new THREE.MeshLambertMaterial({color:0x3a2410});
  // 床は全フロア共通の石畳テクスチャを貼る（エントランスも含む）
  const floorTex=getFloorTexture();
  floorTex.repeat.set(1,1);
  const fMat=new THREE.MeshLambertMaterial({map:floorTex});
  // 天井はコンクリート風テクスチャを貼る（一人称モードの時だけ表示する）
  let cMat;
  if(useWallTexture){
    const ceilTex=getCeilingTexture();
    ceilTex.repeat.set(1,1);
    cMat=new THREE.MeshLambertMaterial({map:ceilTex});
  } else {
    cMat=new THREE.MeshLambertMaterial({color:0x0c0804});
  }
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      const wx=x*CELL,wz=y*CELL;
      if(MAP[y][x]===0){
        const fl=new THREE.Mesh(fGeo,fMat);fl.rotation.x=-Math.PI/2;fl.position.set(wx,0,wz);fl.receiveShadow=true;scene.add(fl);
        const cl=new THREE.Mesh(cGeo,cMat);cl.rotation.x=Math.PI/2;cl.position.set(wx,WALL_H,wz);cl.visible=firstPersonMode;scene.add(cl);ceilingMeshes.push(cl);
        [{dx:0,dz:-1,ry:0,ox:0,oz:-CELL/2},{dx:0,dz:1,ry:Math.PI,ox:0,oz:CELL/2},{dx:-1,dz:0,ry:Math.PI/2,ox:-CELL/2,oz:0},{dx:1,dz:0,ry:-Math.PI/2,ox:CELL/2,oz:0}].forEach(s=>{
          const nx=x+s.dx,ny=y+s.dz;
          if(nx<0||nx>=MAP_W||ny<0||ny>=MAP_H||MAP[ny][nx]===1){
            const wm=new THREE.Mesh(wGeo,wMat());wm.position.set(wx+s.ox,WALL_H/2,wz+s.oz);wm.rotation.y=s.ry;wm.castShadow=true;wm.receiveShadow=true;
            wm.userData.gx=x;wm.userData.gz=y;
            scene.add(wm);wallMeshes.push(wm);
          }
        });
      } else {
        const bm=new THREE.Mesh(bGeo,wMat());bm.position.set(wx,WALL_H/2,wz);bm.castShadow=true;bm.receiveShadow=true;
        bm.userData.gx=x;bm.userData.gz=y;
        scene.add(bm);wallMeshes.push(bm);
      }
    }
  }
}

// ボクセルパーツ生成ヘルパー
function vox(w,h,d,col,x,y,z,grp){
  const m=new THREE.Mesh(

// 巻物を読む（使い切り）
// 巻物使用：まず共通エフェクト（魔法陣・自機発光・キラキラ・SE）を再生し、
// それが終わってから実際の効果を発動する。onDoneは効果発動後（敵ターン開始など）に呼ぶ
function useScroll(it, onDone){
  const db=ITEM_DB[it.key];
  playScrollActivateFx(scrollCategoryColor(it.key));
  // 既存のアニメロック機構（'delay'）に載せて、入力ブロックが他の演出に上書きされないようにする
  addAnim({type:'delay',mesh:playerGroup,baseX:playerGroup.position.x,baseZ:playerGroup.position.z,dx:0,dz:0,dist:0,duration:200,onEnd:()=>{
    const skipEnemyTurn=applyScrollEffect(it, db);
    removeFromInv(it);
    updateUI();
    // 帰還の巻物で帰還処理を開始した場合は、既にダンジョンを離れる最中なので
    // このターンは敵を行動させない（帰還完了前にモンスターに攻撃されるのを防ぐ）
    if(onDone && !skipEnemyTurn) onDone();
  }});
}

function applyScrollEffect(it, db){
  const eff=db.effect.scroll;
  const visEnemies=enemies.filter(e=>e.hp>0&&e.mesh.visible);
  switch(eff){
    case 'enchantWeapon': {
      if(equippedWeapon){ equippedWeapon.plus++; showAction(`${ITEM_DB[equippedWeapon.key].name}が+${equippedWeapon.plus}に輝いた！`,1500); }
      else { showAction('強化できる武器がない…',1200); }
      break;
    }
    case 'enchantShield': {
      if(equippedArmor){ equippedArmor.plus++; showAction(`${ITEM_DB[equippedArmor.key].name}が+${equippedArmor.plus}に輝いた！`,1500); }
      else { showAction('強化できる盾がない…',1200); }
      break;
    }
    case 'teleport': {
      let room,p,tries=0;
      do {
        room=rooms[Math.floor(Math.random()*rooms.length)];
        p=rndInRoom(room);
        tries++;
      } while(tries<30 && enemies.some(e=>e.hp>0&&e.x===p.x&&e.y===p.y));
      state.x=p.x; state.y=p.y;
      playerGroup.position.set(state.x*CELL,0,state.y*CELL);
      camX=state.x*CELL;camZ=state.y*CELL;
      updatePlayerPos();updateExplored();
      showAction('体がふわっと浮いて移動した！',1500);
      break;
    }
    case 'return':
      if(state.inEntrance){ showAction('ここでは使えない…',1200); break; }
      setLog('帰還');
      state.adventureCount=(state.adventureCount||1)+1; // 帰還の巻物で今回の冒険が終了
      fadeTransition(()=>{
        resetPlayerStatsForEntrance();
        initEntrance();
      }, 'エントランス');
      return true; // 帰還処理を開始したら、このターンは敵を行動させない
    case 'confuseAll':
      if(visEnemies.length===0){ showAction('何も起きなかった…',1000); break; }
      visEnemies.forEach(e=>{ e.confused=(e.confused||0)+8; });
      showAction('周囲の敵が混乱した！',1500);
      break;
    case 'sleepAll':
      if(visEnemies.length===0){ showAction('何も起きなかった…',1000); break; }
      visEnemies.forEach(e=>{ e.sleep=(e.sleep||0)+8; });
      showAction('周囲の敵が眠った！',1500);
      break;
    case 'luck':
      if(state.lv>=MAX_LEVEL){ showAction('これ以上レベルは上がらない…',1200); break; }
      state.lv++;
      state.nextExp = state.lv<MAX_LEVEL ? (LEVEL_EXP_TOTAL[state.lv+1]-LEVEL_EXP_TOTAL[state.lv]) : Infinity;
      state.maxHp+=5;
      state.hp=state.maxHp;
      showAction(`幸運の巻物の効果でLv${state.lv}にあがった！ HP全回復`,2000);
      sfxLevelUp();
      updateUI();
      break;
    case 'damageAll':
      if(visEnemies.length===0){ showAction('何も起きなかった…',1000); break; }
      visEnemies.forEach(e=>{
        e.hp-=db.effect.power;
        spawnDamageNum(e.mesh.position.x,2.0,e.mesh.position.z,`${db.effect.power}`,'#ffffff');
        if(e.hp<=0)damageEnemy(e,0);
      });
      triggerFlash('rgba(255,220,80,');
      showAction('衝撃波が周囲を襲った！',1500);
      break;
    case 'map':
      for(let yy=0;yy<MAP_H;yy++)for(let xx=0;xx<MAP_W;xx++){ if(MAP[yy][xx]===0) explored[yy][xx]=true; }
      showAction('フロアの地図が頭に浮かんだ！',1500);
      break;
    case 'sealAll':
      if(visEnemies.length===0){ showAction('何も起きなかった…',1000); break; }
      visEnemies.forEach(e=>{ e.sealed=10; });
      showAction('周囲の敵の能力を封じた！',1500);
      break;
    default:
      showAction('何も起きなかった…',1000);
  }
}


function useStaff(it){
  const db=ITEM_DB[it.key];
  if(it.charges<=0){
    showAction('振っても効果がなかった…',1200);
    return;
  }
  it.charges--;
  // 向いている方向の直線上の最初の敵を探す
  const dx=DIR_DX[state.dir], dz=DIR_DY[state.dir];
  let target=null;
  for(let step=1;step<=20;step++){
    const cx=state.x+dx*step, cz=state.y+dz*step;
    if(!isWalkable(cx,cz))break;
    const e=enemies.find(en=>en.hp>0&&en.x===cx&&en.y===cz);
    if(e){target=e;break;}
  }
  showAction(target?`${db.name}を振った！`:`${db.name}を振ったが、その先には誰もいなかった…`,target?900:1200);
  fireWandBolt(dx,dz,db.effect,target);
  updateUI();
}

// 杖の光弾演出＋効果適用（必中）
function fireWandBolt(dx,dz,eff,target){
  // ロジック即時：命中していれば効果を確定
  if(target){
    applyWandEffect(eff,target,dx,dz);
  }
  // 見た目の光弾（魔法演出と同様）
  const geo=new THREE.SphereGeometry(0.13,6,6);
  const mat=new THREE.MeshBasicMaterial({color:0xffe060});
  const bolt=new THREE.Mesh(geo,mat);
  bolt.position.set(state.x*CELL,0.9,state.y*CELL);
  scene.add(bolt);
  const lt=acquirePooledLight(0xffe060,3,2);
  lt.position.copy(bolt.position);
  const tx=target?target.x*CELL:state.x*CELL+dx*CELL*6;
  const tz=target?target.y*CELL:state.y*CELL+dz*CELL*6;
  wandBolts.push({mesh:bolt,dx,dz,targetX:tx,targetY:tz,dist:0,light:lt,hit:!!target});
}

const wandBolts=[];
function updateWandBolts(dt){
  for(let i=wandBolts.length-1;i>=0;i--){
    const b=wandBolts[i];
    const speed=11;
    b.dist+=speed*dt;
    b.mesh.position.x+=b.dx*speed*dt*CELL;
    b.mesh.position.z+=b.dz*speed*dt*CELL;
    if(b.light)b.light.position.copy(b.mesh.position);
    const reached=(b.dx!==0 ? (b.dx>0?b.mesh.position.x>=b.targetX:b.mesh.position.x<=b.targetX)
                            : (b.dz!==0 ? (b.dz>0?b.mesh.position.z>=b.targetY:b.mesh.position.z<=b.targetY) : true));
    if(reached||b.dist>25){
      triggerFlash('rgba(255,220,80,');
      if(b.hit) sfxWandHit(); // 杖の光弾がモンスターに命中した時の軽い爆発音（全杖共通）
      releasePooledLight(b.light);
      disposeObject3D(b.mesh);
      scene.remove(b.mesh);
      wandBolts.splice(i,1);
    }
  }
}

// 杖の効果を敵に適用（投げた薬と同じ必中ロジック）
function applyWandEffect(eff,e,wdx,wdz){
  // 命中すれば眠っていても目を覚まし、自機に気づく（遠距離からの命中でも、
  // 視界範囲外で即座に見失って再び眠ってしまわないよう、命中した瞬間の自機の
  // 位置を「最後に見た位置」として記憶させる）
  e.aware=true;
  e.lastSeenX=state.x; e.lastSeenY=state.y; e.investigating=false; e.chaseDistMap=null;
  switch(eff.wand){
    case 'damage':
      e.hp-=eff.power;
      spawnDamageNum(e.mesh.position.x,2.0,e.mesh.position.z,`${eff.power}`,'#ffffff');
      if(e.hp<=0)damageEnemy(e,0);
      break;
    case 'sleep':
      e.sleep=(e.sleep||0)+8; showAction('敵が眠った！',1000);
      break;
    case 'confuse':
      e.confused=(e.confused||0)+8; showAction('敵が混乱した！',1000);
      break;
    case 'swap': {
      const ex=e.x,ey=e.y;
      if(isWalkable(state.x,state.y)){
        e.x=state.x; e.y=state.y;
        e.mesh.position.set(e.x*CELL,0,e.y*CELL);
      }
      state.x=ex; state.y=ey;
      updatePlayerPos();updateExplored();
      showAction('場所が入れ替わった！',1000);
      break;
    }
    case 'knockback': {
      // 杖を撃った方向（wdx,wdz）へ直線に、進める限り複数マス吹き飛ばす
      const kx=wdx!==undefined?wdx:Math.sign(e.x-state.x);
      const kz=wdz!==undefined?wdz:Math.sign(e.y-state.y);
      let nx=e.x, ny=e.y;
      for(let s=1;s<=4;s++){
        const tx=e.x+kx*s, ty=e.y+kz*s;
        if(!isWalkable(tx,ty))break;
        if(enemies.some(o=>o!==e&&o.x===tx&&o.y===ty))break;
        nx=tx; ny=ty;
      }
      e.x=nx; e.y=ny;
      e.mesh.position.set(e.x*CELL,0,e.y*CELL);
      showAction('敵を吹き飛ばした！',1000);
      break;
    }
    case 'seal': {
      e.sealed=10;
      const sealName=MONSTER_DB[e.monType]?MONSTER_DB[e.monType].name:'敵';
      showAction(`${sealName}の特殊攻撃を封じた！`,1200);
      break;
    }
  }
  updateUI();
}

// 下り階段のテクスチャをCanvasで生成（一度だけ作って使い回す）
let _stairsTexture=null;
// 金貨コインに貼る黒い$マークのテクスチャをCanvasで生成（一度だけ作って使い回す）
let _dollarMarkTexture=null;
function getDollarMarkTexture(){
  if(_dollarMarkTexture)return _dollarMarkTexture;
  const S=64;
  const cv=document.createElement('canvas');
  cv.width=S; cv.height=S;
  const c=cv.getContext('2d');
  c.clearRect(0,0,S,S);
  c.font='bold 58px "Courier New", monospace';
  c.textAlign='center';
  c.textBaseline='middle';
  c.fillStyle='#000000';
  c.fillText('$', S/2, S/2+2);

// 巻物使用時に足元へ表示する魔法陣のテクスチャ（白線・透明背景、色は使用時にmaterial.colorで着色）
let _magicCircleTexture=null;
function getMagicCircleTexture(){
  if(_magicCircleTexture)return _magicCircleTexture;
  const S=128, cx=S/2, cy=S/2;
  const cv=document.createElement('canvas');
  cv.width=S; cv.height=S;
  const c=cv.getContext('2d');
  c.clearRect(0,0,S,S);
  c.strokeStyle='#ffffff';
  c.lineWidth=2;
  // 外側と内側の円
  c.beginPath(); c.arc(cx,cy,58,0,Math.PI*2); c.stroke();
  c.beginPath(); c.arc(cx,cy,44,0,Math.PI*2); c.stroke();
  // 内接する六芒星（2つの三角形）
  const star=(r,rot)=>{
    c.beginPath();
    for(let i=0;i<3;i++){
      const a=rot+i*(Math.PI*2/3)-Math.PI/2;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
    }
    c.closePath(); c.stroke();
  };
  star(40,0);
  star(40,Math.PI);
  // 外周のルーン風の目盛り
  c.lineWidth=1.6;
  for(let i=0;i<12;i++){
    const a=i*(Math.PI*2/12);
    const x1=cx+Math.cos(a)*58, y1=cy+Math.sin(a)*58;
    const x2=cx+Math.cos(a)*66, y2=cy+Math.sin(a)*66;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.magFilter=THREE.LinearFilter;
  _magicCircleTexture=tex;
  return tex;
}

function getStairsTexture(){
  if(_stairsTexture)return _stairsTexture;
  const S=64; // テクスチャ解像度
  const cv=document.createElement('canvas');
  cv.width=S; cv.height=S;
  const c=cv.getContext('2d');
  // 背景（黒い穴）
  c.fillStyle='#050508'; c.fillRect(0,0,S,S);
  const pad=5;
  const inner=S-pad*2;
  // 手前（左）が高く明るく、奥（右）に向かって低く暗くなる、階段の側面シルエット風の縦棒
  const bars=[
    {col:'#e8e8ec', h:0.90},
    {col:'#a8b0b8', h:0.64},
    {col:'#707880', h:0.42},
    {col:'#383c42', h:0.22},
  ];
  const gap=2;
  const barW=(inner-gap*(bars.length-1))/bars.length;
  bars.forEach((b,i)=>{
    const x=pad+i*(barW+gap);
    const h=inner*b.h;
    const y=S-pad-h;
    c.fillStyle=b.col;
    c.fillRect(x,y,barW,h);
    // 段の上端にハイライト
    c.fillStyle='rgba(255,255,255,0.3)';
    c.fillRect(x,y,barW,Math.max(1,h*0.08));
    // ドット状のノイズで質感を出す
    for(let n=0;n<16;n++){
      const nx=x+Math.random()*barW;
      const ny=y+Math.random()*h;
      c.fillStyle=Math.random()<0.5?'rgba(0,0,0,0.18)':'rgba(255,255,255,0.15)';
      c.fillRect(nx,ny,1,1);
    }
  });
  const tex=new THREE.CanvasTexture(cv);
  tex.magFilter=THREE.NearestFilter; // ドット感を残す
  tex.minFilter=THREE.LinearMipmapLinearFilter;
  _stairsTexture=tex;
  return tex;
}

// 床の石畳（暖色寄りのニュートラルグレー）と見分けやすいよう青みがかった色にしつつ、
// 他の壁と同じ「目地で区切られたブロック」構造にして、遠目にもブロック一つ一つの
// 境界とハイライト/シャドウによる凹凸がはっきり分かるようにする（情報量は控えめに）
let _caveWallTexture=null;
function getCaveWallTexture(){
  if(_caveWallTexture)return _caveWallTexture;
  const S=64;
  const cv=document.createElement('canvas');
  cv.width=S; cv.height=S;
  const c=cv.getContext('2d');
  c.fillStyle='#05070c'; // 目地（暗い青みがかった隙間）
  c.fillRect(0,0,S,S);
  const rows=3, cols=3;
  const rh=S/rows, rw=S/cols;
  const gap=3;
  for(let ry=0; ry<rows; ry++){
    const offset=(ry%2===0)?0:rw/2; // 1段おきに半マスずらして不規則な岩肌に
    for(let rx=-1; rx<=cols; rx++){
      const x=rx*rw+offset, y=ry*rh;
      const bx=x+gap/2, by=y+gap/2, bw=rw-gap, bh=rh-gap;
      const g=76+Math.floor(Math.random()*20)-10; // ブロックごとの濃淡は控えめに
      c.fillStyle=`rgb(${Math.round(g*0.66)},${Math.round(g*0.80)},${g})`;
      c.fillRect(bx,by,bw,bh);
      // 立体感を出すハイライト（左上）とシャドウ（右下）で凹凸をはっきりさせる
      c.fillStyle='rgba(220,235,255,0.28)';
      c.fillRect(bx,by,bw,3);
      c.fillRect(bx,by,3,bh);
      c.fillStyle='rgba(0,0,0,0.45)';
      c.fillRect(bx,by+bh-3,bw,3);
      c.fillRect(bx+bw-3,by,3,bh);
    }
  }
  const tex=new THREE.CanvasTexture(cv);
  tex.magFilter=THREE.NearestFilter;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  _caveWallTexture=tex;
  return tex;
}

function spawnObject(type,gx,gy,arg,count){
  const wx=gx*CELL,wz=gy*CELL;let mesh;
  if(type==='stairs'){

    const tex=getStairsTexture();

    const plane=new THREE.Mesh(geo, mat);

    plane.position.set(wx, 0.06, wz);
    plane.userData={gx,gy};
    scene.add(plane);objectMeshes.push(plane);
    return;
  } else if(type==='return'){
    mesh=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.7,0.2,10),new THREE.MeshLambertMaterial({color:0x2080ff,emissive:0x102040}));
    mesh.position.set(wx,0.1,wz);
    mesh.userData={gx,gy};
    const lt=new THREE.PointLight(0x4080ff,2,4);lt.position.set(wx,1,wz);scene.add(lt);
  } else if(type==='exitportal'){
    // ボス撃破後の脱出口：青い光の柱を床から立てる
    mesh=new THREE.Group();
    const core=new THREE.Mesh(
      new THREE.CylinderGeometry(0.12,0.12,3.2,12),
      new THREE.MeshBasicMaterial({color:0x90d0ff})
    );
    core.position.y=1.6;
    mesh.add(core);
    const glow=new THREE.Mesh(
      new THREE.CylinderGeometry(0.4,0.4,3.2,16),
      new THREE.MeshBasicMaterial({color:0x2080ff,transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false})
    );
    glow.position.y=1.6;
    mesh.add(glow);
    const ring=new THREE.Mesh(
      new THREE.CylinderGeometry(0.7,0.8,0.15,16),
      new THREE.MeshLambertMaterial({color:0x2080ff,emissive:0x1040a0})
    );
    ring.position.y=0.08;
    mesh.add(ring);
    mesh.position.set(wx,0,wz);
    const plt=new THREE.PointLight(0x4090ff,3,6);plt.position.set(wx,1.4,wz);scene.add(plt);
    exitPortalAnim={core,glow,light:plt};
  } else if(type==='item'){
    const itemPool=DUNGEON_ITEM_POOLS[state.dungeonType]||FLOOR_ITEM_KEYS;
    const key=arg||itemPool[Math.floor(Math.random()*itemPool.length)];
    const db=ITEM_DB[key];
    const g=new THREE.Group();
    buildItemMesh(g, db.type);
    // バウンディングボックスの中心を原点に揃える（マス目の真ん中に来るように）
    const box=new THREE.Box3().setFromObject(g);
    const center=box.getCenter(new THREE.Vector3());
    const size=box.getSize(new THREE.Vector3());
    g.children.forEach(child=>{ child.position.sub(center); });
    const itemScale=db.type==='food'?2.2*0.75:2.2;
    g.scale.set(itemScale,itemScale,itemScale);
    // 縦長の武器・盾・杖・巻物・矢は寝かせる、薬・食べ物は立てたまま
    if(db.type==='weapon'||db.type==='shield'||db.type==='staff'||db.type==='scroll'||db.type==='arrow'){
      g.rotation.x=-Math.PI/2;
      // 寝かせた時、床から浮く高さ = 回転後に厚みとなるローカルZサイズの半分
      g.position.set(wx, Math.max(0.06,(size.z/2)*itemScale), wz);
    } else {
      // 立てたまま：底面が床に接するよう高さの半分だけ持ち上げる
      g.position.set(wx, (size.y/2)*itemScale, wz);
    }
    scene.add(g);
    g.userData={gx,gy};
    // 矢は本数（3〜9本、明示指定がなければランダム）を持つ
    const itemCount = db.type==='arrow' ? (count!==undefined?count:3+Math.floor(Math.random()*7)) : undefined;
    floorItems.push({x:gx, y:gy, mesh:g, key, count:itemCount});
    mesh=null;

      new THREE.TorusGeometry(0.24,0.03,8,20),
      new THREE.MeshLambertMaterial({color:COIN_RIM})
    );

    rim.position.set(0,0.165,0);

      new THREE.CylinderGeometry(0.15,0.15,0.02,16),
      new THREE.MeshLambertMaterial({color:COIN_CORE})
    );
    core.position.set(0,0.17,0);
    g.add(core);
    // 視認しやすいよう、コイン表面に黒い$マークを重ねて描く
    const markTex=getDollarMarkTexture();
    const mark=new THREE.Mesh(
      new THREE.PlaneGeometry(0.364,0.364),
      new THREE.MeshBasicMaterial({map:markTex, transparent:true})
    );

    mark.position.set(0,0.182,0);
    g.add(mark);
    g.scale.set(1.5,1.5,1.5);
    g.position.set(wx,0.05,wz);

// 壁に貼る紙（案内サイン）のテクスチャを生成する（少し黄ばんだ紙に文字を描く）
function createSignTexture(text){
  const W=256,H=320;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#e8dcc0';
  c.fillRect(0,0,W,H);
  // 四隅を少し暗くして年季の入った紙らしい質感にする
  const grad=c.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(70,50,20,0.28)');
  c.fillStyle=grad;
  c.fillRect(0,0,W,H);
  c.strokeStyle='#7a6440';
  c.lineWidth=6;
  c.strokeRect(10,10,W-20,H-20);
  c.fillStyle='#2a2016';
  c.font='bold 84px "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  c.textAlign='center';
  c.textBaseline='middle';
  c.fillText(text, W/2, H/2+6);
  const tex=new THREE.CanvasTexture(cv);
  tex.magFilter=THREE.LinearFilter;
  tex.minFilter=THREE.LinearMipmapLinearFilter;
  return tex;
}
// 指定マス(gx,gy)から見て指定方向(dir: 'n'|'s'|'e'|'w')の壁に、テクスチャ済みの紙を貼り付ける
// （サイズはワールド単位。省略時はCELL*0.5 x CELL*0.62の小さい紙）
function spawnWallSignMesh(gx,gy,dir,tex,w,h){
  const geo=new THREE.PlaneGeometry(w||CELL*0.5,h||CELL*0.62);
  const mat=new THREE.MeshBasicMaterial({map:tex});
  const plane=new THREE.Mesh(geo,mat);
  const wx=gx*CELL, wz=gy*CELL;
  // 壁本体(wGeo)はマス境界を中心に厚み0.12(半分0.06)を持つため、その手前面よりさらに
  // 少し浮かせて貼らないと壁の中に埋まってしまう（半厚み0.06 + 余裕0.03）
  const eps=0.06+0.03;
  const y=1.4; // ほぼ目線の高さ
  if(dir==='n'){ plane.position.set(wx,y,wz-CELL/2+eps); plane.rotation.y=0; }
  else if(dir==='s'){ plane.position.set(wx,y,wz+CELL/2-eps); plane.rotation.y=Math.PI; }
  else if(dir==='w'){ plane.position.set(wx-CELL/2+eps,y,wz); plane.rotation.y=Math.PI/2; }
  else if(dir==='e'){ plane.position.set(wx+CELL/2-eps,y,wz); plane.rotation.y=-Math.PI/2; }
  plane.userData={gx,gy};
  scene.add(plane);
  objectMeshes.push(plane);
  return plane;
}
// 指定マス(gx,gy)から見て指定方向(dir)の壁に、短い一言だけの案内サインを貼り付ける
function spawnWallSign(gx,gy,dir,text){
  return spawnWallSignMesh(gx,gy,dir,createSignTexture(text),CELL*0.5,CELL*0.62);
}
// 指定した画像ファイル(png/jpg等)を、指定マス(gx,gy)から見て指定方向(dir)の壁に貼り付ける
const _wallImageLoader=new THREE.TextureLoader();
function spawnWallImage(gx,gy,dir,path,w,h){
  const tex=_wallImageLoader.load(path);
  return spawnWallSignMesh(gx,gy,dir,tex,w,h);
}
// チュートリアル用紙（タイトル＋番号付きルール、任意で簡単な図）のテクスチャを生成する
function createRuleSignTexture(title,rules){
  const W=320,H=460;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#e8dcc0';
  c.fillRect(0,0,W,H);
  const grad=c.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.8);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(70,50,20,0.28)');
  c.fillStyle=grad;
  c.fillRect(0,0,W,H);
  c.strokeStyle='#7a6440';
  c.lineWidth=6;
  c.strokeRect(10,10,W-20,H-20);

  c.fillStyle='#2a2016';
  c.textAlign='center';
  c.font='bold 30px "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  c.fillText(title,W/2,50);
  c.strokeStyle='#9a8358';
  c.lineWidth=2;
  c.beginPath();c.moveTo(28,68);c.lineTo(W-28,68);c.stroke();

  let y=68;
  rules.forEach((rule,i)=>{
    y+=36;
    // 丸番号
    c.beginPath();
    c.fillStyle='#5a4526';
    c.arc(38,y-8,14,0,Math.PI*2);
    c.fill();
    c.fillStyle='#e8dcc0';
    c.font='bold 18px sans-serif';
    c.textAlign='center';
    c.fillText(String(i+1),38,y-2);
    // ルール本文
    c.fillStyle='#2a2016';
    c.font='20px "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
    c.textAlign='left';
    rule.lines.forEach(line=>{ c.fillText(line,62,y); y+=28; });
    if(rule.diagram==='turnChange'){ y+=8; drawTurnChangeDiagram(c,W/2,y+40); y+=104; }
    if(i<rules.length-1){
      y+=14;
      c.strokeStyle='rgba(154,131,88,0.6)';
      c.lineWidth=1.5;
      c.beginPath();c.moveTo(28,y-8);c.lineTo(W-28,y-8);c.stroke();
    }
  });

  const tex=new THREE.CanvasTexture(cv);
  tex.magFilter=THREE.LinearFilter;
  tex.minFilter=THREE.LinearMipmapLinearFilter;
  return tex;
}
// 「中央ボタンを押しながら方向ボタン」＝ターン消費なしで向き変更、を表す簡単な図
// （長押しを表す丸 ＋ 押す方向の矢印 ＝ ターン消費「0」、という3コマの記号列にする）
function drawTurnChangeDiagram(c,cx,cy){
  c.save();
  c.strokeStyle='#5a4526';
  c.fillStyle='#5a4526';
  c.lineWidth=3;
  c.lineCap='round';
  // 1コマ目：長押しを表す二重丸
  const x1=cx-100;
  c.beginPath();c.arc(x1,cy,16,0,Math.PI*2);c.stroke();
  c.beginPath();c.arc(x1,cy,7,0,Math.PI*2);c.fill();
  // ＋
  c.font='bold 26px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('+',cx-60,cy);
  // 2コマ目：押す方向を示す矢印（右上向き）
  const x2=cx-16,y2=cy;
  c.beginPath();
  c.moveTo(x2-14,y2+14);c.lineTo(x2+12,y2-12);
  c.moveTo(x2+12,y2-12);c.lineTo(x2-2,y2-12);
  c.moveTo(x2+12,y2-12);c.lineTo(x2+12,y2+2);
  c.stroke();
  // ＝
  c.fillText('=',cx+34,cy);
  // 3コマ目：ターン消費0
  c.beginPath();c.roundRect ? c.roundRect(cx+58,cy-18,44,36,6) : c.rect(cx+58,cy-18,44,36);c.stroke();
  c.font='bold 20px sans-serif';
  c.fillText('0',cx+80,cy);
  c.restore();
}

// 倉庫の5x5スペースに床マーカーを表示（解放済み/未解放）
function buildWarehouseFloor(room){
  const baseX=room.cx-2, baseY=room.cy-2; // 5x5の左上
  for(let sy=0;sy<5;sy++){
    for(let sx=0;sx<5;sx++){
      const idx=sy*5+sx;
      const gx=baseX+sx, gy=baseY+sy;
      const wx=gx*CELL, wz=gy*CELL;
      const unlocked=idx<warehouseUnlocked;
      const marker=new THREE.Mesh(
        new THREE.BoxGeometry(CELL*0.85,0.06,CELL*0.85),
        new THREE.MeshBasicMaterial({color:unlocked?0x8a6030:0x302418,transparent:true,opacity:unlocked?0.5:0.25})
      );
      marker.position.set(wx,0.03,wz);
      marker.userData={gx,gy,isWarehouseSlot:true,slotIndex:idx};
      scene.add(marker);
      objectMeshes.push(marker);
    }
  }
}

// フロア初期化
function initFloor(floor){
  state.inEntrance=false;
  state.floor=floor;
  // 最深部（ボス階）はダンジョン曲からボス戦用BGMへクロスフェードで切り替える
  if(floor===10&&state.dungeonType!=='beginner'&&bgmTrack!==BGM_TRACKS.boss){
    if(bgmPlaying) stopBGM();
    startBGM('boss');
  }
  npcList=[];
  exitPortalPos=null; exitPortalAnim=null;
  floorTurnCount=0; updateTurnCounterDisplay(); // このフロアでのターン数をリセット
  const keep=new Set([playerGroup,playerLight,fillLight,guideLine,...lightPool]);
  const rem=[];scene.children.forEach(c=>{if(!keep.has(c)&&!(c instanceof THREE.AmbientLight))rem.push(c);});
  rem.forEach(c=>{disposeObject3D(c);scene.remove(c);});
  lightPool.forEach(lt=>{lt.intensity=0;});
  wallMeshes.length=0;fadedWalls.clear();ceilingMeshes.length=0;objectMeshes.length=0;floorItems=[];enemies=[];

  const res=generateMap(floor);MAP=res.cells;rooms=res.rooms;
  // 探索フラグ初期化（全て未探索）
  explored=Array.from({length:MAP_H},()=>Array(MAP_W).fill(false));
  buildDungeon();

  const startRoom=rooms[Math.floor(Math.random()*rooms.length)];
  const sp=rndInRoom(startRoom);state.x=sp.x;state.y=sp.y;
  playerGroup.position.set(state.x*CELL,0,state.y*CELL); // 初期位置は即セット
  camX=state.x*CELL;camZ=state.y*CELL;
  updateExplored();

  const otherRooms=rooms.filter(r=>r!==startRoom);
  const stairRoom=otherRooms[Math.floor(Math.random()*otherRooms.length)]||startRoom;
  // 10Fは最深部なので階段を置かない
  if(floor>=10){
    stairsPos=null;
  } else {
    stairsPos=rndInRoom(stairRoom);spawnObject('stairs',stairsPos.x,stairsPos.y);
  }

  returnPos=null;
  if(RETURN_FLOORS.includes(floor)){
    const rc=rooms.filter(r=>r!==startRoom&&r!==stairRoom);
    const rr=rc.length>0?rc[Math.floor(Math.random()*rc.length)]:stairRoom;
    returnPos=rndInRoom(rr);spawnObject('return',returnPos.x,returnPos.y);
  }

  rooms.forEach(room=>{
    const cnt=Math.floor(Math.random()*3);
    for(let i=0;i<cnt;i++){
      // 初級ダンジョンはアイテムのドロップ量を通常の50%に抑える
      if(state.dungeonType==='beginner'&&Math.random()>=0.5)continue;
      let p=null, tries=0;
      while(tries<10){
        const cand=rndInRoom(room);
        const bl=(stairsPos&&cand.x===stairsPos.x&&cand.y===stairsPos.y)||
                 (returnPos&&cand.x===returnPos.x&&cand.y===returnPos.y)||
                 floorItems.some(f=>f.x===cand.x&&f.y===cand.y);
        if(!bl){ p=cand; break; }
        tries++;
      }
      if(p) spawnObject('item',p.x,p.y);
    }
    // 金貨（各部屋50%で1個、10〜100ゴールド）
    if(Math.random()<0.5){
      let gp=null, tries2=0;
      while(tries2<10){
        const cand=rndInRoom(room);
        const occupied=floorItems.some(f=>f.x===cand.x&&f.y===cand.y)||
          (stairsPos&&cand.x===stairsPos.x&&cand.y===stairsPos.y)||
          (returnPos&&cand.x===returnPos.x&&cand.y===returnPos.y);
        if(!occupied){ gp=cand; break; }
        tries2++;
      }
      if(gp){
        const amount=10+Math.floor(Math.random()*10)*10; // 10〜100（10刻み）
        spawnObject('gold',gp.x,gp.y,amount);
      }
    }
  });

  // 初級ダンジョン：各階で必ず1つ配置する装備・アイテム（プレイヤーの成長を保証する）。
  // 「保証」する以上、1部屋だけで10回試して駄目なら諦める通常の抽選ロジックでは
  // 弱いため、全部屋をランダムな順で回って必ずどこかに置けるようにする
  if(state.dungeonType==='beginner'&&BEGINNER_GUARANTEED_ITEMS[floor]){
    BEGINNER_GUARANTEED_ITEMS[floor].forEach(entry=>{
      const roomOrder=rooms.slice().sort(()=>Math.random()-0.5);
      for(const room of roomOrder){
        let p=null, tries=0;
        while(tries<10){
          const cand=rndInRoom(room);
          const bl=(stairsPos&&cand.x===stairsPos.x&&cand.y===stairsPos.y)||
                   (returnPos&&cand.x===returnPos.x&&cand.y===returnPos.y)||
                   floorItems.some(f=>f.x===cand.x&&f.y===cand.y);
          if(!bl){ p=cand; break; }
          tries++;
        }
        if(p){ spawnObject('item',p.x,p.y,entry.key,entry.count); break; }
      }
    });
  }

  // 階層別モンスタースポーン
  const monTypes=(DUNGEON_MONSTER_POOLS[state.dungeonType]||FLOOR_MONSTER_POOL)[floor]||['slime'];

  if(floor===10){
    // 10F：ボス1体のみ、部屋中央に配置（上級ダンジョンは魔王、それ以外はドラゴン）
    const bossType=state.dungeonType==='advanced'?'demonlord':'dragon';
    const bossRoom=rooms[0];
    const bp=rndInRoom(bossRoom);
    spawnObject('enemy',bp.x,bp.y,bossType);
  } else {
    // 初級ダンジョンは階層ごとに少なめの敵数、中級は1〜9Fで7〜8体を均等にスポーン
    let targetCount;
    if(state.dungeonType==='beginner'&&BEGINNER_MONSTER_COUNT[floor]){
      const [lo,hi]=BEGINNER_MONSTER_COUNT[floor];
      targetCount=lo+Math.floor(Math.random()*(hi-lo+1));
    } else {
      targetCount=7+Math.floor(Math.random()*2);
    }
    let spawned=0;
    let attempts=0;
    const usedPositions=new Set();
    while(spawned<targetCount&&attempts<200){
      attempts++;
      // 全部屋からランダムに選ぶ
      const room=rooms[Math.floor(Math.random()*rooms.length)];
      const p=rndInRoom(room);
      const key=`${p.x},${p.y}`;
      const bl=(p.x===state.x&&p.y===state.y)||
               (stairsPos&&p.x===stairsPos.x&&p.y===stairsPos.y)||
               (returnPos&&p.x===returnPos.x&&p.y===returnPos.y)||
               usedPositions.has(key);
      if(!bl){
        usedPositions.add(key);
        const monType=monTypes[Math.floor(Math.random()*monTypes.length)];
        spawnObject('enemy',p.x,p.y,monType);
        spawned++;
      }
    }
  }

  // 自機が他フロアにいた間に配送予約されたモンスターを、このフロアに出現させる
  if(pendingFloorSpawns[floor]){
    const pendingCount=pendingFloorSpawns[floor];
    delete pendingFloorSpawns[floor];
    for(let i=0;i<pendingCount;i++){
      const room=rooms[Math.floor(Math.random()*rooms.length)];
      let p=null, tries=0;
      while(tries<10){
        const cand=rndInRoom(room);
        const bl=(cand.x===state.x&&cand.y===state.y)||
                 (stairsPos&&cand.x===stairsPos.x&&cand.y===stairsPos.y)||
                 (returnPos&&cand.x===returnPos.x&&cand.y===returnPos.y)||
                 enemies.some(e=>e.x===cand.x&&e.y===cand.y);
        if(!bl){ p=cand; break; }
        tries++;
      }
      if(p){
        const monType=monTypes[Math.floor(Math.random()*monTypes.length)];
        spawnObject('enemy',p.x,p.y,monType);
      }
    }
  }

  updatePlayerPos();updateCamera();updateUI();
  saveGame();
}

// 中断・セーブ機能（localStorageで最大3スロットを管理）
// ============================================================
const SAVE_KEY_BASE='dungeon3d_save_v1';
const SAVE_SLOT_COUNT=3;
function saveKeyForSlot(slot){ return `${SAVE_KEY_BASE}_slot${slot}`; }
// プレイ中にオートセーブする対象スロット。タイトルで「つづきから／はじめから」を選んだ際に切り替わる
let currentSlot=1;
// タイトル画面で実際にスロットを選んでプレイを開始したか。falseの間はbeforeunload等での
// オートセーブを行わない（プレイ開始前に閉じただけで空の状態がスロット1に書き込まれるのを防ぐ）
let sessionStarted=false;

// スロット制導入前（v1の単一セーブ）のデータが残っていれば、スロット1として引き継ぐ
(function migrateLegacySave(){
  try{
    const legacy=localStorage.getItem(SAVE_KEY_BASE);
    if(legacy===null)return;
    if(localStorage.getItem(saveKeyForSlot(1))===null){
      localStorage.setItem(saveKeyForSlot(1), legacy);
    }
    localStorage.removeItem(SAVE_KEY_BASE);
  }catch(e){
    console.error('旧セーブデータの引き継ぎに失敗しました', e);
  }
})();

function serializeSave(){
  const data={
    version:1,
    savedAt:Date.now(),
    state:{...state},
    playerSleepTurns,
    nextItemId,
    warehouseUnlocked,
    warehouseData,
    pendingFloorSpawns,
    inventory:inventory.map(it=>{
      const o={id:it.id,key:it.key,plus:it.plus||0,equipped:!!it.equipped};
      if(it.charges!==undefined)o.charges=it.charges;
      if(it.count!==undefined)o.count=it.count;
      return o;
    }),
    floor:null
  };
  if(!state.inEntrance){
    data.floor={
      MAP, rooms, stairsPos, returnPos, explored,
      floorItems:floorItems.map(f=>({x:f.x,y:f.y,key:f.key,gold:f.gold,count:f.count})),
      enemies:enemies.map(e=>({
        x:e.x,y:e.y,hp:e.hp,maxHp:e.maxHp,atk:e.atk,def:e.def,exp:e.exp,
        type:e.type,monType:e.monType,roomIdx:e.roomIdx,aware:e.aware,
        sleep:e.sleep||0,confused:e.confused||0,sealed:e.sealed||0,
        poisoned:e.poisoned||0,atkDown:e.atkDown||0
      }))
    };
  }
  return data;
}

function saveGame(){
  if(spectatorMode)return false; // AI観戦モードのプレイ内容でプレイヤーのセーブを上書きしない
  if(!sessionStarted)return false; // タイトルでスロットを選ぶ前は保存対象がないため何もしない
  try{
    localStorage.setItem(saveKeyForSlot(currentSlot), JSON.stringify(serializeSave()));
    return true;
  }catch(e){
    console.error('セーブに失敗しました', e);
    return false;
  }
}

// ターンごとの自動セーブ（0.3秒間隔で間引き、連打時の負荷を抑える）
let lastAutoSaveTime=0;
function saveGameThrottled(){
  const now=performance.now();
  if(now-lastAutoSaveTime<300)return;
  lastAutoSaveTime=now;
  saveGame();
}

// 読み込んだデータが復元処理に使える最低限の形をしているか検証する（壊れたデータでの復元失敗を防ぐ）
function isValidSaveData(data){
  return !!data && typeof data==='object'
    && data.state && typeof data.state==='object' && typeof data.state.hp==='number'
    && Array.isArray(data.inventory);
}

function hasSaveData(slot){
  try{ return !!localStorage.getItem(saveKeyForSlot(slot)); }catch(e){ return false; }
}

function hasAnySaveData(){
  for(let i=1;i<=SAVE_SLOT_COUNT;i++){ if(hasSaveData(i))return true; }
  return false;
}

function hasEmptySlot(){
  for(let i=1;i<=SAVE_SLOT_COUNT;i++){ if(!hasSaveData(i))return true; }
  return false;
}

function deleteSaveSlot(slot){
  try{ localStorage.removeItem(saveKeyForSlot(slot)); }catch(e){ console.error('セーブデータの削除に失敗しました', e); }
}

function loadSaveData(slot){
  const key=saveKeyForSlot(slot);
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return null;
    const data=JSON.parse(raw);
    if(!isValidSaveData(data)){
      console.error(`スロット${slot}のセーブデータの形式が不正なため破棄します`);
      try{ localStorage.removeItem(key); }catch(e2){}
      return null;
    }
    return data;
  }catch(e){
    console.error('セーブデータの読み込みに失敗しました', e);
    try{ localStorage.removeItem(key); }catch(e2){}
    return null;
  }
}

function applySave(data){
  Object.assign(state, data.state);
  // この機能追加より前のセーブデータにはadventureCountが無いため、1回目として扱う
  // （data.state基準で判定し、以前のセッションのstateに残った値を引き継がないようにする）
  state.adventureCount=data.state.adventureCount!==undefined?data.state.adventureCount:1;
  // この機能追加より前のセーブデータには開放フラグが無い。既存プレイヤーが
  // 遊べていたダンジョンを突然ロックしないよう、旧データは全開放扱いにする
  state.normalUnlocked=data.state.normalUnlocked!==undefined?data.state.normalUnlocked:true;
  state.advancedUnlocked=data.state.advancedUnlocked!==undefined?data.state.advancedUnlocked:true;
  playerSleepTurns=data.playerSleepTurns||0;
  nextItemId=data.nextItemId||nextItemId;
  warehouseUnlocked=data.warehouseUnlocked!==undefined?data.warehouseUnlocked:warehouseUnlocked;
  warehouseData=data.warehouseData||{};
  pendingFloorSpawns=data.pendingFloorSpawns||{};

  inventory.length=0;
  equippedWeapon=null; equippedArmor=null; equippedArrow=null;
  (data.inventory||[]).forEach(saved=>{
    const db=ITEM_DB[saved.key];
    if(!db)return;
    const it={id:saved.id, key:saved.key, plus:saved.plus||0, equipped:!!saved.equipped};
    if(saved.charges!==undefined)it.charges=saved.charges;
    if(saved.count!==undefined)it.count=saved.count;
    inventory.push(it);
    if(it.equipped){
      if(db.type==='weapon') equippedWeapon=it;
      else if(db.type==='shield'||db.type==='armor') equippedArmor=it;
      else if(db.type==='arrow') equippedArrow=it;
    }
  });

  if(!data.floor){
    state.inEntrance=true;
    const sx=state.x, sy=state.y;
    initEntrance(); // 内部でsaveGame()が再度走るが問題ない
    state.x=sx; state.y=sy;
    playerGroup.position.set(state.x*CELL,0,state.y*CELL);
    camX=state.x*CELL;camZ=state.y*CELL;
    updatePlayerPos();updateExplored();
  } else {
    restoreFloor(data.floor);
  }
  updateUI();
}

// WebGLコンテキスト復元時などに、セーブデータを介さず「今の状態」をそのまま
// 再構築するための関数（直前の行動を失わずに画面だけを復旧できる）
function rebuildCurrentScene(){
  if(state.inEntrance){
    const sx=state.x, sy=state.y;
    initEntrance();
    state.x=sx; state.y=sy;
    playerGroup.position.set(state.x*CELL,0,state.y*CELL);
    camX=state.x*CELL;camZ=state.y*CELL;
    updatePlayerPos();updateExplored();updateCamera();
  } else {
    const floorSnapshot={
      MAP, rooms, stairsPos, returnPos, explored,
      floorItems: floorItems.map(f=>({x:f.x,y:f.y,key:f.key,gold:f.gold,count:f.count})),
      enemies: enemies.map(e=>({
        x:e.x,y:e.y,hp:e.hp,maxHp:e.maxHp,atk:e.atk,def:e.def,exp:e.exp,
        type:e.type,monType:e.monType,roomIdx:e.roomIdx,aware:e.aware,
        sleep:e.sleep||0,confused:e.confused||0,sealed:e.sealed||0,
        poisoned:e.poisoned||0,atkDown:e.atkDown||0
      }))
    };
    restoreFloor(floorSnapshot);
  }
}

// 保存されたフロア状態をそのまま復元（ランダム生成しない）
function restoreFloor(floorData){
  state.inEntrance=false;
  npcList=[];
  floorTurnCount=0; updateTurnCounterDisplay();
  const keep=new Set([playerGroup,playerLight,fillLight,guideLine,...lightPool]);
  const rem=[];scene.children.forEach(c=>{if(!keep.has(c)&&!(c instanceof THREE.AmbientLight))rem.push(c);});
  rem.forEach(c=>{disposeObject3D(c);scene.remove(c);});
  lightPool.forEach(lt=>{lt.intensity=0;});
  wallMeshes.length=0;fadedWalls.clear();ceilingMeshes.length=0;objectMeshes.length=0;floorItems=[];enemies=[];

  MAP=floorData.MAP;
  rooms=floorData.rooms;
  explored=floorData.explored;
  stairsPos=floorData.stairsPos;
  returnPos=floorData.returnPos;

  buildDungeon();

  // カメラ・自機位置は最優先で確定させる（この後の敵/アイテム復元で
  // 何か失敗しても、画面が真っ暗にならないようにするため）
  playerGroup.position.set(state.x*CELL,0,state.y*CELL);
  camX=state.x*CELL;camZ=state.y*CELL;
  updatePlayerPos();updateExplored();updateCamera();

  try{
    if(stairsPos) spawnObject('stairs',stairsPos.x,stairsPos.y);
    if(returnPos) spawnObject('return',returnPos.x,returnPos.y);
  }catch(err){ console.error('階段/帰還ポイントの復元に失敗しました',err); }

  (floorData.floorItems||[]).forEach(f=>{
    try{
      if(f.key==='gold'){ spawnObject('gold',f.x,f.y,f.gold); }
      else if(ITEM_DB[f.key]){ spawnObject('item',f.x,f.y,f.key,f.count); }
      else { console.warn('不明なアイテムキーをスキップしました',f.key); }
    }catch(err){ console.error('床アイテムの復元に失敗しました',f,err); }
  });

  (floorData.enemies||[]).forEach(saved=>{
    try{
      if(!MONSTER_DB[saved.monType]){ console.warn('不明なモンスター種別をスキップしました',saved.monType); return; }
      spawnObject('enemy',saved.x,saved.y,saved.monType);
      const e=enemies[enemies.length-1];
      if(e){
        e.hp=saved.hp; e.maxHp=saved.maxHp; e.atk=saved.atk; e.def=saved.def; e.exp=saved.exp;
        e.aware=saved.aware; e.sleep=saved.sleep||0; e.confused=saved.confused||0;
        e.sealed=saved.sealed||0; e.poisoned=saved.poisoned||0; e.atkDown=saved.atkDown||0;
        e.roomIdx=saved.roomIdx;
        // 保存データには「最後に見た自機の位置」は含まれないため、復元直後に
        // 気づいている状態の敵は、ひとまず自分の現在地を最後に見た位置として
        // 扱う（今のターンで自機が見えなければ、その場で捜索を諦めて通常状態に戻る）
        if(e.aware){ e.lastSeenX=e.x; e.lastSeenY=e.y; }
      }
    }catch(err){ console.error('敵の復元に失敗しました',saved,err); }
  });
}

// カメラ
const _v=new THREE.Vector3();
let firstPersonMode=false; // 試験的な一人称視点モード（ステータスバー下のボタンで切り替え）
let minimapVisible=true; // プレイ画面（#game-area）をタップするたびに表示/非表示を切り替える
let spectatorMode=false; // AI観戦モード：プレイヤー操作を無効化し、AIが自動でプレイする
const FP_EYE_HEIGHT=1.3;
function updateCamera(){
  // 自機の論理座標（補間後）にカメラを追従させる（攻撃突進などの演出では動かさない）
  const px=camX, pz=camZ;
  if(firstPersonMode){
    // 一人称：自機の位置・向きに合わせてカメラ自体を配置する（視線は床と平行）
    const fx=Math.cos(state.angle), fz=Math.sin(state.angle);
    camera.position.set(px, FP_EYE_HEIGHT, pz);
    camera.lookAt(px+fx, FP_EYE_HEIGHT, pz+fz);
  } else {
    camera.position.set(px, 11, pz+5.5);
    camera.lookAt(px, 0.5, pz-0.5);
  }
  // 一人称視点中は自機の姿がカメラと重なって邪魔になるため非表示にする
  playerGroup.visible=!firstPersonMode;
  // 天井は一人称視点の時だけ表示する（三人称は見下ろすアングルのため不要）
  ceilingMeshes.forEach(c=>{c.visible=firstPersonMode;});

  wallMeshes.forEach(m=>{
    if(m.material.transparent){
      m.material.transparent=false;
      m.material.opacity=1;
      m.material.needsUpdate=true;
    }
  });

  playerLight.position.set(px,1.8,pz);
  fillLight.position.set(px,2,pz);
  // 部屋なら広く明るく、通路なら狭く（2マス先まで）。エントランスは常に明るい
  const inRoom=state.inEntrance || rooms.some(r=>state.x>=r.x&&state.x<r.x+r.w&&state.y>=r.y&&state.y<r.y+r.h);
  if(inRoom){
    playerLight.distance=30; playerLight.intensity=15;
    fillLight.distance=40; fillLight.intensity=7;
    ambLight.intensity=8.5;
  } else {
    // 通路：自機の周囲が円形に明るく照らされる（画像のような光だまり）
    playerLight.distance=CELL*4.2; playerLight.intensity=20;
    fillLight.distance=CELL*4.5; fillLight.intensity=5;
    ambLight.intensity=2.6;
  }
}

const dialogueText=document.getElementById('dialogue-text');

function checkDialogueDistance(){

  const d=Math.max(Math.abs(state.x-activeDialogueNPC.x),Math.abs(state.y-activeDialogueNPC.y));
